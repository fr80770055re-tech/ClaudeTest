<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周長與面積出題工具｜四年級數學</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #2563EB;
      --blue-lt: #DBEAFE;
      --green:   #16A34A;
      --green-lt:#F0FDF4;
      --red:     #DC2626;
      --red-lt:  #FEF2F2;
      --yellow:  #FEF9C3;
      --ink:     #1E293B;
      --muted:   #64748B;
      --border:  #E2E8F0;
      --white:   #FFFFFF;
      --radius:  12px;
      --shadow:  0 4px 20px rgba(37,99,235,.10);
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--green-lt);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: var(--blue);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 3px 12px rgba(37,99,235,.35);
    }
    header .logo {
      width: 44px; height: 44px;
      background: #fff;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    header .logo svg { width: 28px; height: 28px; }
    header h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: .04em; }
    header p  { font-size: .8rem; opacity: .8; margin-top: 2px; }
    header .badge {
      margin-left: auto;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: .78rem;
      white-space: nowrap;
    }

    /* ─── Layout ─── */
    .app { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }

    /* ─── Tabs ─── */
    .tabs {
      display: flex; gap: 6px;
      background: var(--white);
      border-radius: var(--radius);
      padding: 6px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1; padding: 10px 0;
      border: none; background: transparent;
      border-radius: 8px;
      font-family: inherit; font-size: .9rem; font-weight: 700;
      color: var(--muted); cursor: pointer;
      transition: background .18s, color .18s;
    }
    .tab-btn.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37,99,235,.30);
    }

    /* ─── Panel ─── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ─── Settings ─── */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .field {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .field label {
      display: block;
      font-size: .8rem; font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .field select, .field input[type=number] {
      width: 100%; padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-family: inherit; font-size: .95rem; color: var(--ink);
      background: var(--white);
      outline: none;
      transition: border-color .18s;
    }
    .field select:focus, .field input:focus { border-color: var(--blue); }

    .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .checkbox-group label {
      display: flex; align-items: center; gap: 8px;
      font-size: .9rem; font-weight: 500; color: var(--ink);
      cursor: pointer;
      text-transform: none; letter-spacing: 0;
    }
    .checkbox-group input[type=checkbox] {
      width: 18px; height: 18px; accent-color: var(--blue); cursor: pointer;
    }

    /* ─── Generate btn ─── */
    .btn-primary {
      display: block; width: 100%;
      padding: 14px;
      background: var(--blue);
      color: #fff;
      border: none; border-radius: var(--radius);
      font-family: inherit; font-size: 1rem; font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37,99,235,.35);
      transition: opacity .18s, transform .12s;
      letter-spacing: .05em;
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* ─── Quiz ─── */
    .quiz-meta {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .quiz-meta .progress-wrap {
      flex: 1; min-width: 180px;
      height: 10px; background: var(--border); border-radius: 99px; overflow: hidden;
    }
    .quiz-meta .progress-bar {
      height: 100%; background: var(--blue); border-radius: 99px;
      transition: width .35s ease;
    }
    .quiz-meta .counter { font-size: .85rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .quiz-meta .score-live {
      background: var(--blue-lt); color: var(--blue);
      padding: 4px 12px; border-radius: 20px;
      font-size: .82rem; font-weight: 700;
    }

    /* ─── Question card ─── */
    .q-card {
      background: var(--yellow);
      border: 2px solid #FBBF24;
      border-radius: var(--radius);
      padding: 22px 22px 18px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(251,191,36,.18);
      animation: pop-in .25s ease;
    }
    @keyframes pop-in {
      from { opacity:0; transform: scale(.97) translateY(6px); }
      to   { opacity:1; transform: scale(1)  translateY(0); }
    }
    .q-number {
      font-size: .78rem; font-weight: 700; color: #92400E;
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 8px;
    }
    .q-text {
      font-size: 1.1rem; font-weight: 700; line-height: 1.6;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .q-text em {
      font-style: normal;
      color: var(--blue);
      background: var(--blue-lt);
      padding: 1px 6px; border-radius: 4px;
    }

    /* ─── SVG shape ─── */
    .shape-wrap {
      display: flex; justify-content: center;
      margin-bottom: 18px;
    }
    .shape-wrap svg {
      max-width: 260px; width: 100%; height: auto;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.08));
    }

    /* ─── Answer input ─── */
    .answer-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .answer-row input[type=number] {
      width: 120px; padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-family: inherit; font-size: 1.1rem; font-weight: 700;
      color: var(--ink);
      outline: none;
      transition: border-color .18s;
    }
    .answer-row input:focus { border-color: var(--blue); }
    .answer-row .unit { font-size: .95rem; font-weight: 700; color: var(--muted); }
    .answer-row .btn-check {
      padding: 10px 22px;
      background: var(--ink); color: #fff;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: .95rem; font-weight: 700;
      cursor: pointer;
      transition: background .18s;
    }
    .answer-row .btn-check:hover { background: var(--blue); }

    /* ─── Feedback ─── */
    .feedback {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: .95rem; font-weight: 700;
      display: none;
    }
    .feedback.correct {
      background: #DCFCE7; color: var(--green);
      border: 1.5px solid #86EFAC;
      display: block;
    }
    .feedback.wrong {
      background: var(--red-lt); color: var(--red);
      border: 1.5px solid #FCA5A5;
      display: block;
    }

    /* ─── Nav ─── */
    .nav-btns {
      display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;
    }
    .btn-nav {
      flex: 1; min-width: 110px;
      padding: 11px;
      border: 2px solid var(--border);
      background: var(--white);
      border-radius: 8px;
      font-family: inherit; font-size: .9rem; font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .18s, color .18s;
    }
    .btn-nav:hover { border-color: var(--blue); color: var(--blue); }

    /* ─── Result ─── */
    #result-panel {
      background: var(--white);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .result-circle {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: var(--blue-lt);
      border: 4px solid var(--blue);
      margin: 0 auto 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .result-circle .big { font-size: 2rem; font-weight: 900; color: var(--blue); line-height: 1; }
    .result-circle .sub { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    #result-panel h2 { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; }
    #result-panel p  { color: var(--muted); font-size: .95rem; margin-bottom: 24px; }

    .review-list { text-align: left; margin-bottom: 24px; }
    .review-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: .9rem;
    }
    .review-item.ok  { background: #F0FDF4; border-left: 3px solid var(--green); }
    .review-item.bad { background: var(--red-lt); border-left: 3px solid var(--red); }
    .review-item .ri { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
    .review-item strong { display: block; font-weight: 700; color: var(--ink); }
    .review-item span  { color: var(--muted); font-size: .83rem; }

    .btn-restart {
      display: inline-block;
      padding: 12px 32px;
      background: var(--blue);
      color: #fff;
      border: none; border-radius: var(--radius);
      font-family: inherit; font-size: 1rem; font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37,99,235,.30);
      transition: opacity .18s;
    }
    .btn-restart:hover { opacity: .88; }

    /* ─── Print ─── */
    .btn-print {
      display: inline-block;
      padding: 12px 24px;
      background: var(--white);
      color: var(--blue);
      border: 2px solid var(--blue);
      border-radius: var(--radius);
      font-family: inherit; font-size: .9rem; font-weight: 700;
      cursor: pointer;
      margin-left: 10px;
      transition: background .18s;
    }
    .btn-print:hover { background: var(--blue-lt); }

    @media (max-width: 540px) {
      header h1 { font-size: 1rem; }
      .q-text { font-size: 1rem; }
    }

    @media print {
      header, .tabs, .settings-grid, .btn-primary, .nav-btns, .quiz-meta,
      .btn-restart, .btn-print, #tab-settings, #tab-quiz .answer-row, #tab-quiz .feedback { display: none !important; }
      body { background: #fff; }
      .q-card { border: 1.5px solid #aaa; background: #fff; box-shadow: none; page-break-inside: avoid; margin-bottom: 14px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="10" height="10" rx="1.5" fill="#2563EB"/>
      <rect x="15" y="3" width="10" height="10" rx="1.5" fill="#16A34A"/>
      <rect x="3" y="15" width="10" height="10" rx="1.5" fill="#F59E0B"/>
      <rect x="15" y="15" width="10" height="10" rx="1.5" fill="#2563EB" opacity=".4"/>
    </svg>
  </div>
  <div>
    <h1>周長與面積 出題工具</h1>
    <p>台灣國小四年級數學</p>
  </div>
  <div class="badge">Grade 4 · Math</div>
</header>

<div class="app">
  <!-- Tabs -->
  <div class="tabs" role="tablist">
    <button class="tab-btn active" role="tab" onclick="switchTab('settings')">⚙️ 出題設定</button>
    <button class="tab-btn" role="tab" id="tab-quiz-btn" onclick="switchTab('quiz')">📝 開始作答</button>
    <button class="tab-btn" role="tab" id="tab-result-btn" onclick="switchTab('result')">🏆 成績報告</button>
  </div>

  <!-- 出題設定 -->
  <div class="panel active" id="tab-settings">
    <div class="settings-grid">
      <div class="field">
        <label>題目數量</label>
        <select id="cfg-count">
          <option value="5">5 題</option>
          <option value="10" selected>10 題</option>
          <option value="15">15 題</option>
          <option value="20">20 題</option>
        </select>
      </div>
      <div class="field">
        <label>數字範圍（最大邊長）</label>
        <select id="cfg-range">
          <option value="10">1 – 10 cm</option>
          <option value="20" selected>1 – 20 cm</option>
          <option value="30">1 – 30 cm</option>
        </select>
      </div>
      <div class="field">
        <label>題型選擇</label>
        <div class="checkbox-group">
          <label><input type="checkbox" id="chk-rect" checked> 長方形（周長／面積）</label>
          <label><input type="checkbox" id="chk-square" checked> 正方形（周長／面積）</label>
          <label><input type="checkbox" id="chk-l" checked> L 形組合圖形</label>
          <label><input type="checkbox" id="chk-rev"> 已知面積求邊長</label>
        </div>
      </div>
      <div class="field">
        <label>作答模式</label>
        <select id="cfg-mode">
          <option value="quiz">即時批改</option>
          <option value="exam">全部作答後批改</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" onclick="generateQuiz()">🎲 產生題目，開始作答！</button>
  </div>

  <!-- 作答 -->
  <div class="panel" id="tab-quiz">
    <div class="quiz-meta">
      <span class="counter" id="q-counter">第 1 題／共 10 題</span>
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:10%"></div></div>
      <span class="score-live" id="score-live">✅ 0 / 0</span>
    </div>
    <div id="q-area"></div>
    <div class="nav-btns">
      <button class="btn-nav" onclick="prevQ()">← 上一題</button>
      <button class="btn-nav" id="btn-next" onclick="nextQ()">下一題 →</button>
      <button class="btn-nav" onclick="finishQuiz()" style="border-color:#DC2626;color:#DC2626">交卷 ✔</button>
    </div>
  </div>

  <!-- 成績 -->
  <div class="panel" id="tab-result">
    <div id="result-panel">
      <div class="result-circle">
        <span class="big" id="r-pct">—</span>
        <span class="sub">分</span>
      </div>
      <h2 id="r-msg">–</h2>
      <p id="r-sub">–</p>
      <div class="review-list" id="review-list"></div>
      <button class="btn-restart" onclick="restart()">🔄 重新出題</button>
      <button class="btn-print" onclick="window.print()">🖨️ 列印試卷</button>
    </div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let questions = [];
let answers   = [];   // user answers
let checked   = [];   // boolean, answered?
let current   = 0;
let cfg       = {};

// ─── Tab switch ───────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  const idx = ['settings','quiz','result'].indexOf(name);
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
}

// ─── Random helpers ───────────────────────────────────────────────────────────
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

// ─── Question generators ─────────────────────────────────────────────────────
function makeRect(max) {
  const w = rnd(2, max), h = rnd(2, max);
  const askPeri = Math.random() < .5;
  const ans = askPeri ? 2*(w+h) : w*h;
  const unit = askPeri ? 'cm' : 'cm²';
  const typeLabel = askPeri ? '周長' : '面積';
  return {
    type: 'rect', w, h,
    text: `右圖是一個長方形，長為 <em>${w} cm</em>，寬為 <em>${h} cm</em>，請求出它的${typeLabel}。`,
    askPeri, ans, unit, typeLabel,
    shape: drawRect(w, h, askPeri)
  };
}

function makeSquare(max) {
  const s = rnd(2, max);
  const askPeri = Math.random() < .5;
  const ans = askPeri ? 4*s : s*s;
  const unit = askPeri ? 'cm' : 'cm²';
  const typeLabel = askPeri ? '周長' : '面積';
  return {
    type: 'square', s,
    text: `右圖是一個正方形，邊長為 <em>${s} cm</em>，請求出它的${typeLabel}。`,
    askPeri, ans, unit, typeLabel,
    shape: drawSquare(s, askPeri)
  };
}

function makeLShape(max) {
  const ow = rnd(4, max), oh = rnd(4, max);
  const cw = rnd(1, ow-2),  ch = rnd(1, oh-2);
  const area = ow*oh - cw*ch;
  const peri = 2*(ow+oh);  // outer rect perimeter stays same
  const askPeri = Math.random() < .45;
  const ans = askPeri ? peri : area;
  const unit = askPeri ? 'cm' : 'cm²';
  const typeLabel = askPeri ? '周長' : '面積';
  return {
    type: 'l', ow, oh, cw, ch,
    text: `右圖是一個 L 形圖形，請求出它的${typeLabel}（各尺寸如圖所示）。`,
    askPeri, ans, unit, typeLabel,
    shape: drawLShape(ow, oh, cw, ch, askPeri)
  };
}

function makeReverse(max) {
  const s = rnd(2, max);
  const area = s * s;
  return {
    type: 'rev',
    text: `一個正方形的面積是 <em>${area} cm²</em>，請問它的邊長是多少？`,
    ans: s, unit: 'cm', typeLabel: '邊長',
    shape: drawRevSquare(area)
  };
}

// ─── SVG Drawings ────────────────────────────────────────────────────────────
const PAD = 40, SCALE = 11;

function labelLine(x1,y1,x2,y2,txt,side='top') {
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const off = side==='top'?-12:side==='bot'?14:side==='left'?-18:18;
  const ax = (x1===x2)? off : 0;
  const ay = (y1===y2)? 0  : off;  // swap for vertical
  const isVert = x1===x2;
  return `<text x="${mx + (isVert?off:0)}" y="${my + (isVert?0:off)}"
    text-anchor="middle" dominant-baseline="middle"
    font-size="11" font-weight="700" fill="#1E3A5F" font-family="Noto Sans TC,sans-serif">${txt}</text>`;
}

function arrow(x1,y1,x2,y2) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
    stroke="#94A3B8" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>`;
}

const DEFS = `<defs>
  <marker id="arr" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto">
    <path d="M0,0 L4,2 L0,4 Z" fill="#94A3B8"/>
  </marker>
</defs>`;

function drawRect(w, h, showPeri) {
  const sw = w*SCALE, sh = h*SCALE;
  const vw = sw + PAD*2, vh = sh + PAD*2;
  const x0=PAD, y0=PAD;
  return `<svg viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg">
    ${DEFS}
    <rect x="${x0}" y="${y0}" width="${sw}" height="${sh}" rx="3"
      fill="${showPeri?'#EFF6FF':'#F0FDF4'}" stroke="${showPeri?'#2563EB':'#16A34A'}" stroke-width="2.5"/>
    ${labelLine(x0, y0-6, x0+sw, y0-6, w+'cm','top')}
    ${arrow(x0, y0-8, x0+sw, y0-8)}
    ${labelLine(x0-6, y0, x0-6, y0+sh, h+'cm','left')}
    ${arrow(x0-8, y0, x0-8, y0+sh)}
  </svg>`;
}

function drawSquare(s, showPeri) {
  const ss = s*SCALE;
  const vw = ss + PAD*2, vh = ss + PAD*2;
  const x0=PAD, y0=PAD;
  return `<svg viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg">
    ${DEFS}
    <rect x="${x0}" y="${y0}" width="${ss}" height="${ss}" rx="3"
      fill="${showPeri?'#EFF6FF':'#F0FDF4'}" stroke="${showPeri?'#2563EB':'#16A34A'}" stroke-width="2.5"/>
    <line x1="${x0+ss-8}" y1="${y0+4}" x2="${x0+ss-4}" y2="${y0+4}" stroke="#555" stroke-width="1.5"/>
    <line x1="${x0+ss-4}" y1="${y0+4}" x2="${x0+ss-4}" y2="${y0+8}" stroke="#555" stroke-width="1.5"/>
    ${labelLine(x0, y0-6, x0+ss, y0-6, s+'cm','top')}
    ${arrow(x0, y0-8, x0+ss, y0-8)}
  </svg>`;
}

function drawLShape(ow, oh, cw, ch, showPeri) {
  const sw=ow*SCALE, sh=oh*SCALE, cws=cw*SCALE, chs=ch*SCALE;
  const vw=sw+PAD*2+20, vh=sh+PAD*2+20;
  const x0=PAD, y0=PAD;
  // L shape: full rect minus top-right corner
  const pts = [
    x0, y0,                  // TL
    x0+sw, y0,               // TR
    x0+sw, y0+chs,           // step down
    x0+sw-cws, y0+chs,       // step left
    x0+sw-cws, y0+sh,        // down to bottom
    x0, y0+sh                // BL
  ].join(',');
  const fill = showPeri?'#EFF6FF':'#FFF7ED';
  const stroke = showPeri?'#2563EB':'#EA580C';
  return `<svg viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg">
    ${DEFS}
    <polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- outer labels -->
    ${labelLine(x0, y0-8, x0+sw, y0-8, ow+'cm','top')}
    ${arrow(x0, y0-10, x0+sw, y0-10)}
    ${labelLine(x0-8, y0, x0-8, y0+sh, oh+'cm','left')}
    ${arrow(x0-10, y0, x0-10, y0+sh)}
    <!-- cut labels -->
    <text x="${x0+sw-cws/2}" y="${y0+chs+14}" text-anchor="middle" font-size="10" fill="#92400E" font-weight="700" font-family="Noto Sans TC,sans-serif">${cw}cm</text>
    <text x="${x0+sw+10}" y="${y0+chs/2}" text-anchor="start" dominant-baseline="middle" font-size="10" fill="#92400E" font-weight="700" font-family="Noto Sans TC,sans-serif">${ch}cm</text>
  </svg>`;
}

function drawRevSquare(area) {
  const s = Math.round(Math.sqrt(area));
  const ss = s*SCALE;
  const vw = ss+PAD*2, vh = ss+PAD*2;
  const x0=PAD, y0=PAD;
  return `<svg viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg">
    ${DEFS}
    <rect x="${x0}" y="${y0}" width="${ss}" height="${ss}" rx="3"
      fill="#FEF9C3" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="7,4"/>
    <text x="${x0+ss/2}" y="${y0+ss/2}" text-anchor="middle" dominant-baseline="middle"
      font-size="13" font-weight="900" fill="#92400E" font-family="Noto Sans TC,sans-serif">
      面積 = ${area} cm²
    </text>
    <text x="${x0+ss/2}" y="${y0-10}" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700" font-family="Noto Sans TC,sans-serif">? cm</text>
  </svg>`;
}

// ─── Generate Quiz ────────────────────────────────────────────────────────────
function generateQuiz() {
  cfg = {
    count : +document.getElementById('cfg-count').value,
    range : +document.getElementById('cfg-range').value,
    rect  : document.getElementById('chk-rect').checked,
    square: document.getElementById('chk-square').checked,
    l     : document.getElementById('chk-l').checked,
    rev   : document.getElementById('chk-rev').checked,
    mode  : document.getElementById('cfg-mode').value
  };
  const pool = [];
  if (cfg.rect)   pool.push('rect');
  if (cfg.square) pool.push('square');
  if (cfg.l)      pool.push('l');
  if (cfg.rev)    pool.push('rev');
  if (!pool.length) { alert('請至少選擇一種題型！'); return; }

  questions = [];
  for (let i = 0; i < cfg.count; i++) {
    const t = pool[rnd(0, pool.length-1)];
    if (t==='rect')   questions.push(makeRect(cfg.range));
    else if (t==='square') questions.push(makeSquare(cfg.range));
    else if (t==='l')      questions.push(makeLShape(cfg.range));
    else               questions.push(makeReverse(cfg.range));
  }
  answers = Array(questions.length).fill(null);
  checked = Array(questions.length).fill(false);
  current = 0;
  switchTab('quiz');
  renderQ();
}

// ─── Render Question ──────────────────────────────────────────────────────────
function renderQ() {
  const q = questions[current];
  const n = questions.length;
  document.getElementById('q-counter').textContent = `第 ${current+1} 題／共 ${n} 題`;
  document.getElementById('progress-bar').style.width = ((current+1)/n*100)+'%';

  const score = answers.filter((a,i)=>a!==null && checked[i] && a===questions[i].ans).length;
  const done  = checked.filter(Boolean).length;
  document.getElementById('score-live').textContent = `✅ ${score} / ${done}`;

  document.getElementById('btn-next').textContent =
    current===n-1 ? '最後一題' : '下一題 →';

  const isChecked = checked[current];
  const userAns   = answers[current];
  const isCorrect = userAns === q.ans;

  document.getElementById('q-area').innerHTML = `
    <div class="q-card">
      <div class="q-number">第 ${current+1} 題</div>
      <div class="q-text">${q.text}</div>
      <div class="shape-wrap">${q.shape}</div>
      <div class="answer-row">
        <input type="number" id="ans-input" min="0" step="1"
          value="${userAns !== null ? userAns : ''}"
          placeholder="輸入答案"
          ${isChecked && cfg.mode==='quiz' ? 'disabled' : ''}
          onkeydown="if(event.key==='Enter') checkAnswer()">
        <span class="unit">${q.unit}</span>
        ${cfg.mode==='quiz' && !isChecked
          ? `<button class="btn-check" onclick="checkAnswer()">確認作答</button>`
          : ''}
      </div>
      ${isChecked && cfg.mode==='quiz' ? `
        <div class="feedback ${isCorrect?'correct':'wrong'}">
          ${isCorrect
            ? `🎉 答對了！答案是 <strong>${q.ans} ${q.unit}</strong>`
            : `❌ 答錯了，正確答案是 <strong>${q.ans} ${q.unit}</strong>`
          }
        </div>` : ''}
      ${cfg.mode==='quiz' && !isChecked ? '' : ''}
    </div>`;
  document.getElementById('ans-input')?.focus();
}

// ─── Check Answer ─────────────────────────────────────────────────────────────
function checkAnswer() {
  const val = document.getElementById('ans-input')?.value.trim();
  if (val === '' || val === null) { return; }
  const num = parseInt(val, 10);
  if (isNaN(num)) { alert('請輸入數字！'); return; }
  answers[current] = num;
  checked[current] = true;
  renderQ();
}

function prevQ() {
  if (current > 0) { current--; renderQ(); }
}
function nextQ() {
  // save input before moving
  const val = document.getElementById('ans-input')?.value.trim();
  if (val !== '' && val !== undefined) {
    const num = parseInt(val, 10);
    if (!isNaN(num)) answers[current] = num;
  }
  if (current < questions.length-1) { current++; renderQ(); }
}

// ─── Finish ───────────────────────────────────────────────────────────────────
function finishQuiz() {
  // save current input
  const val = document.getElementById('ans-input')?.value.trim();
  if (val !== '' && val !== undefined) {
    const num = parseInt(val, 10);
    if (!isNaN(num)) { answers[current] = num; checked[current] = true; }
  }
  // mark all answered but unchecked
  answers.forEach((a,i)=>{ if(a!==null) checked[i]=true; });
  showResult();
}

// ─── Result ───────────────────────────────────────────────────────────────────
function showResult() {
  let correct = 0;
  const html = questions.map((q,i)=>{
    const ua = answers[i];
    const ok = ua !== null && ua === q.ans;
    if (ok) correct++;
    return `<div class="review-item ${ok?'ok':'bad'}">
      <span class="ri">${ok?'✅':'❌'}</span>
      <div>
        <strong>第 ${i+1} 題：${q.typeLabel} （${q.type==='rect'?'長方形':q.type==='square'?'正方形':q.type==='l'?'L形':'逆推邊長'}）</strong>
        <span>你的答案：${ua!==null?ua+' '+q.unit:'（未作答）'} ／ 正確答案：${q.ans} ${q.unit}</span>
      </div>
    </div>`;
  }).join('');

  const pct = Math.round(correct/questions.length*100);
  const msgs = [
    [100,'滿分！太厲害了！🏆','你完全掌握了周長與面積！'],
    [80, '優秀！繼續保持 🌟','幾乎全對，再加把勁！'],
    [60, '不錯喔！再努力一下 💪','多複習一下出錯的題目。'],
    [0,  '加油！多練習就會進步 📚','仔細看看每題的圖形和公式。']
  ];
  const [,msg,sub] = msgs.find(([t])=>pct>=t);

  document.getElementById('r-pct').textContent  = pct;
  document.getElementById('r-msg').textContent  = msg;
  document.getElementById('r-sub').textContent  = `答對 ${correct} 題，共 ${questions.length} 題。${sub}`;
  document.getElementById('review-list').innerHTML = html;
  switchTab('result');
}

function restart() { switchTab('settings'); }
</script>

</html>
