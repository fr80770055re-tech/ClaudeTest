<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="橘子時鐘" />
<meta name="theme-color" content="#D9500F" />
<title>橘子時鐘</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<style>
  /* @fonts-begin: self-hosted so the clock works offline (subset: Latin; Big5 Traditional Chinese) */
  @font-face {
    font-family: "Archivo";
    src: url("fonts/archivo.woff2") format("woff2");
    font-weight: 300 900; font-stretch: 100% 125%; font-display: swap;
  }
  @font-face {
    font-family: "Chiron GoRound TC";
    src: url("fonts/chiron-goround-tc.woff2") format("woff2");
    font-weight: 500 900; font-display: swap;
  }
  /* @fonts-end */
  /* Layout: two full-screen pages side by side (clock / price notice), swiped horizontally; teacher controls in a side sheet. */
  :root {
    --orange: #D9500F;
    --orange-deep: #B8420B;
    --orange-ink: #7A2A05;
    --orange-recess: #C4470D; /* orange under the 22% shade: what shows behind the receding clock */
    --cream: #F7EFE2;
    --cream-dim: rgba(247, 239, 226, .93);
    --cream-line: rgba(247, 239, 226, .28);
    --sheet: #F7EFE2;
    --sheet-ink: #4A1C04;
    --sheet-muted: #8A4A22;
    --sheet-line: #E6D6BF;
    --field: #FFFAF2;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --latin: "Archivo", "Chiron GoRound TC", system-ui, sans-serif;
    --han: "Chiron GoRound TC", "Archivo", "PingFang TC", system-ui, sans-serif;
    --pad-x: max(4.2vw, env(safe-area-inset-left, 0px));
    --pad-r: max(4.2vw, env(safe-area-inset-right, 0px));
    --pad-t: max(3.2vh, env(safe-area-inset-top, 0px));
    --pad-b: max(3.6vh, env(safe-area-inset-bottom, 0px));
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--orange);
    color: var(--cream);
    font-family: var(--han);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--cream); color: var(--orange); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; border-radius: 12px; }

  /* ─── Pager ─── */
  .pager { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: var(--orange-recess); }
  .track { position: absolute; inset: 0; }
  /* The notice is a card stacked on the clock: it slides over it while the clock recedes. */
  .page {
    position: absolute; inset: 0;
    background: var(--orange);
    transform-origin: 50% 50%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-x);
  }

  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: clamp(24px, 2.6vw, 34px);
    font-weight: 700;
    letter-spacing: .02em;
  }
  .top .weekday { color: var(--cream-dim); font-weight: 500; margin-left: .6em; }
  .top .ampm {
    font-family: var(--latin);
    font-variation-settings: "wdth" 112;
    font-weight: 700;
    letter-spacing: .08em;
  }

  /* ─── Time ─── */
  .time {
    align-self: center; justify-self: center;
    display: flex; align-items: flex-start;
    font-family: var(--latin);
    font-weight: 800;
    font-variation-settings: "wdth" 118;
    line-height: .8;
    letter-spacing: -.02em;
    font-size: min(23.5vw, 54vh);
    margin-top: -2vh;
  }
  .digit { display: inline-block; width: .7em; text-align: center; }
  .colon {
    display: inline-block; width: .42em; text-align: center;
    transform: translateY(-.06em);
    transition: opacity .6s var(--ease);
  }
  .colon.dim { opacity: .35; }
  .seconds {
    font-size: .2em; font-weight: 600;
    font-variation-settings: "wdth" 100;
    color: var(--cream-dim);
    margin-left: .35em; margin-top: .12em;
    letter-spacing: 0;
  }
  .seconds .digit { width: .6em; }

  /* ─── Bottom row (clock page) ─── */
  .bottom { min-height: 64px; display: flex; align-items: center; padding-right: 160px; }
  .next {
    display: flex; align-items: center; gap: 14px;
    font-size: clamp(24px, 2.4vw, 30px);
    font-weight: 700;
    max-width: calc(50vw - 80px);
    min-width: 0;
  }
  .next svg { width: 1.15em; height: 1.15em; flex: none; }
  .next #nextText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .next .when { font-family: var(--latin); font-variation-settings: "wdth" 110; font-weight: 700; }
  .next .lbl { color: var(--cream-dim); font-weight: 500; }
  .next.empty { color: var(--cream-dim); font-weight: 500; }

  /* ─── Notice page ─── */
  .page > :not(.shade) { translate: var(--edge, 0px) 0; }
  .shade { position: absolute; inset: 0; background: var(--orange-ink); opacity: 0; pointer-events: none; }
  /* The notice pours in over the clock through a liquid edge (clip-path), led by a darker wave. */
  .notice { gap: 3vh; z-index: 2; }
  .wave { position: absolute; inset: 0; z-index: 1; background: var(--orange-deep); visibility: hidden; pointer-events: none; }
  .pager.moving .page, .pager.moving .wave, .pager.moving .n-items li { will-change: transform, clip-path; }
  .n-head { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; min-width: 0; }
  .n-head h1 {
    margin: 0; min-width: 0;
    font-size: clamp(40px, 6vw, 84px);
    font-weight: 900; letter-spacing: .04em; line-height: 1.1;
    overflow-wrap: anywhere;
  }
  .n-clock {
    flex: none;
    font-family: var(--latin); font-weight: 800; font-variation-settings: "wdth" 116;
    font-size: clamp(32px, 4vw, 56px); line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--cream-dim);
  }
  .n-items {
    list-style: none; margin: 0; padding: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
    grid-auto-flow: column;
    grid-template-rows: repeat(var(--rows, 1), auto);
    column-gap: 6vw;
    align-content: center;
    font-size: var(--ifs, 48px);
  }
  .n-items li {
    display: flex; align-items: baseline; gap: .6em;
    padding: .28em 0;
    border-bottom: 2px solid var(--cream-line);
    min-width: 0;
  }
  .n-items .nm { flex: 1; min-width: 0; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .n-items .pr {
    flex: none;
    font-family: var(--latin); font-weight: 800; font-variation-settings: "wdth" 112;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .n-items .unit { font-family: var(--han); font-weight: 700; font-size: .5em; margin-left: .15em; color: var(--cream-dim); }
  .n-items li.n-empty {
    display: block; border: 0; font-size: clamp(24px, 2.6vw, 34px); font-weight: 500;
    color: var(--cream-dim); text-align: center; line-height: 1.6;
  }
  .n-foot { min-height: 64px; display: flex; align-items: center; padding-right: 160px; }
  .n-note { margin: 0; font-size: clamp(24px, 2.6vw, 34px); font-weight: 700; color: var(--cream-dim); line-height: 1.3; max-width: calc(50vw - 100px); overflow-wrap: anywhere; }

  /* ─── Fixed chrome ─── */
  .dots {
    position: fixed; left: 50%; bottom: var(--pad-b);
    transform: translateX(-50%);
    display: flex; gap: 4px; height: 64px; align-items: center;
  }
  .dots button {
    width: 44px; height: 44px; border: 0; background: transparent; padding: 0;
    display: grid; place-items: center;
  }
  .dots button::before {
    content: ""; width: var(--w, 12px); height: 12px; border-radius: 6px;
    background: var(--cream); opacity: var(--o, .3);
  }

  .actions {
    position: fixed; right: var(--pad-r); bottom: var(--pad-b);
    display: flex; gap: 14px;
  }
  .icon-btn {
    width: 64px; height: 64px;
    display: grid; place-items: center;
    background: transparent;
    border: 2px solid var(--cream-line);
    border-radius: 50%;
    transition: background .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  }
  .icon-btn svg { width: 28px; height: 28px; }
  .icon-btn:hover { border-color: var(--cream); }
  .icon-btn:active { transform: scale(.94); background: rgba(247,239,226,.12); }

  .hint {
    position: fixed; left: 50%; top: var(--pad-t);
    transform: translate(-50%, 0);
    background: var(--cream); color: var(--orange-ink);
    font-size: 18px; font-weight: 700; white-space: nowrap;
    padding: 12px 22px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(74, 28, 4, .25);
    transition: opacity .5s var(--ease), transform .5s var(--ease);
  }
  .hint.gone { opacity: 0; transform: translate(-50%, -16px); pointer-events: none; }

  /* ─── Settings sheet ─── */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(74, 28, 4, .35);
    opacity: 0; pointer-events: none;
    transition: opacity .45s var(--ease);
  }
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(480px, 92vw);
    background: var(--sheet); color: var(--sheet-ink);
    padding:
      max(24px, env(safe-area-inset-top, 0px))
      max(28px, env(safe-area-inset-right, 0px))
      max(24px, env(safe-area-inset-bottom, 0px))
      28px;
    display: flex; flex-direction: column; gap: 20px;
    transform: translateX(110%);
    visibility: hidden;
    transition: transform .55s var(--ease), visibility 0s linear .55s;
    box-shadow: -12px 0 40px rgba(74, 28, 4, .25);
    -webkit-user-select: auto; user-select: auto;
  }
  body.settings-open .scrim { opacity: 1; pointer-events: auto; }
  body.settings-open .sheet { transform: none; visibility: visible; transition: transform .55s var(--ease), visibility 0s; }
  .sheet ::selection { background: var(--orange); color: var(--cream); }
  .sheet :focus-visible { outline-color: var(--orange); }

  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .tabs { display: flex; gap: 22px; }
  .tabs button {
    border: 0; background: transparent; padding: 6px 0;
    font-size: 28px; font-weight: 900; letter-spacing: .02em;
    color: #B07A55;
    border-bottom: 3px solid transparent;
    transition: color .25s var(--ease), border-color .25s var(--ease);
  }
  .tabs button[aria-selected="true"] { color: var(--sheet-ink); border-bottom-color: var(--orange); }
  .close {
    width: 48px; height: 48px; border-radius: 50%;
    border: 0; background: var(--sheet-line);
    display: grid; place-items: center; flex: none;
  }
  .close svg { width: 22px; height: 22px; }

  .panel {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 20px;
    margin-right: -12px; padding-right: 12px;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: var(--sheet-line); border-radius: 3px; }
  .panel[hidden] { display: none; }

  form.add { display: grid; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--sheet-line); }
  .row { display: flex; gap: 12px; }
  .field { display: grid; gap: 6px; flex: 1; min-width: 0; }
  .field > span { font-size: 15px; font-weight: 700; color: var(--sheet-muted); }
  input[type="time"], input[type="text"], textarea {
    width: 100%;
    font: inherit;
    font-size: 20px; font-weight: 700;
    color: var(--sheet-ink);
    background: var(--field);
    border: 2px solid var(--sheet-line);
    border-radius: 14px;
    padding: 12px 14px;
    min-height: 56px;
    caret-color: var(--orange);
    -webkit-appearance: none; appearance: none;
    transition: border-color .25s var(--ease);
  }
  textarea { resize: none; line-height: 1.4; min-height: 84px; }
  input[type="time"], input.num { font-family: var(--latin); font-variation-settings: "wdth" 108; }
  input::placeholder, textarea::placeholder { color: #B07A55; font-weight: 500; }
  input:focus, textarea:focus { outline: none; border-color: var(--orange); }

  .seg {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--sheet-line); border-radius: 14px; padding: 4px;
  }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .seg span {
    display: grid; place-items: center;
    min-height: 48px; border-radius: 10px;
    font-size: 17px; font-weight: 700; color: var(--sheet-muted);
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .seg input:checked + span { background: var(--field); color: var(--sheet-ink); box-shadow: 0 2px 6px rgba(74,28,4,.12); }
  .seg input:focus-visible + span { outline: 3px solid var(--orange); outline-offset: 2px; }

  .primary {
    min-height: 58px; border: 0; border-radius: 14px;
    background: var(--orange); color: var(--cream);
    font-size: 20px; font-weight: 900; letter-spacing: .06em;
    transition: background .25s var(--ease), transform .25s var(--ease), opacity .25s var(--ease);
  }
  .primary:hover { background: var(--orange-deep); }
  .primary:active { transform: scale(.98); }
  .primary:disabled { opacity: .45; cursor: not-allowed; }

  .list-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0; }
  .list-title h2 { margin: 0; font-size: 17px; font-weight: 900; }
  .list-title small { color: var(--sheet-muted); font-size: 15px; font-weight: 500; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--sheet-line);
  }
  .list .t {
    font-family: var(--latin); font-variation-settings: "wdth" 112;
    font-size: 34px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .list .meta { display: block; margin-top: 6px; font-size: 15px; color: var(--sheet-muted); font-weight: 500; }
  .list li.off .t, .list li.off .meta { opacity: .45; }

  .ilist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .ilist li { display: grid; grid-template-columns: 1fr 104px auto auto; gap: 8px; align-items: center; }
  .ilist input { min-height: 48px; padding: 8px 12px; font-size: 18px; }

  .switch {
    width: 58px; height: 34px; border-radius: 999px; border: 0;
    background: var(--sheet-line); position: relative; padding: 0;
    transition: background .3s var(--ease);
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 28px; height: 28px; border-radius: 50%; background: var(--field);
    box-shadow: 0 2px 4px rgba(74,28,4,.2);
    transition: transform .3s var(--ease);
  }
  .switch[aria-checked="true"] { background: var(--orange); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); }

  .del {
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: transparent; color: var(--sheet-muted);
    display: grid; place-items: center;
  }
  .del svg { width: 22px; height: 22px; }
  .del:hover { background: var(--sheet-line); color: var(--sheet-ink); }
  .del:disabled { opacity: .3; cursor: default; background: transparent; }

  .empty-list { color: var(--sheet-muted); font-size: 16px; line-height: 1.6; padding: 14px 0; }

  .prefs { display: grid; gap: 10px; padding-top: 4px; border-top: 1px solid var(--sheet-line); margin-top: auto; }
  .pref { display: flex; justify-content: space-between; align-items: center; min-height: 48px; font-size: 17px; font-weight: 700; }
  .test-btn {
    border: 2px solid var(--sheet-line); background: transparent; border-radius: 12px;
    padding: 8px 14px; font-size: 15px; font-weight: 700; color: var(--sheet-ink); min-height: 44px;
  }
  .offline { font-size: 15px; font-weight: 700; color: var(--sheet-muted); }
  .offline.ready { color: #2F6B1F; }
  .help { margin: 0; font-size: 15px; color: var(--sheet-muted); line-height: 1.6; }

  /* ─── Alarm takeover ─── */
  .alarm {
    position: fixed; inset: 0;
    background: var(--cream); color: var(--orange);
    display: grid; place-items: center; align-content: center; gap: 4vh;
    text-align: center;
    clip-path: circle(0% at 50% 50%);
    transition: clip-path .7s var(--ease);
    pointer-events: none;
  }
  body.alarming .alarm { clip-path: circle(150% at 50% 50%); pointer-events: auto; }
  .alarm .a-time {
    font-family: var(--latin); font-weight: 800; font-variation-settings: "wdth" 118;
    font-size: min(24vw, 40vh); line-height: .85; letter-spacing: -.02em;
  }
  .alarm .a-label { font-size: clamp(30px, 4.6vw, 64px); font-weight: 900; color: var(--orange-ink); max-width: 80vw; overflow-wrap: anywhere; }
  .alarm .a-actions { display: flex; gap: 18px; margin-top: 2vh; }
  .alarm button {
    min-width: 200px; min-height: 72px; border-radius: 999px;
    font-size: 24px; font-weight: 900; letter-spacing: .06em;
    transition: transform .25s var(--ease);
  }
  .alarm button:active { transform: scale(.96); }
  .alarm .ok { background: var(--orange); color: var(--cream); border: 0; }
  .alarm .snooze { background: transparent; color: var(--orange); border: 3px solid var(--orange); }
  .alarm :focus-visible { outline-color: var(--orange); }
  .alarm .a-colon { display: inline-block; margin: 0 .09em; transform: translateY(-.05em); }
  body.alarming .alarm .a-time { animation: pulse 1.2s var(--ease) infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  @media (orientation: portrait) {
    .time { font-size: min(30vw, 34vh); flex-wrap: wrap; justify-content: center; }
    .seconds { flex-basis: 100%; text-align: center; margin: .3em 0 0; }
    .bottom, .n-foot { padding-right: 0; padding-bottom: 80px; }
    .next, .n-note { max-width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
    .page { transition: opacity .2s linear !important; }
  }
</style>
</head>
<body>
  <div class="pager" id="pager">
    <div class="track" id="track">
      <!-- Page 1: clock -->
      <main class="page" id="pClock" aria-label="時鐘">
        <div class="shade" id="shade"></div>
        <header class="top">
          <div><span id="date">—</span><span class="weekday" id="weekday"></span></div>
          <div class="ampm" id="ampm" aria-hidden="true"></div>
        </header>

        <div class="time" id="time" role="timer" aria-live="off" aria-label="目前時間">
          <span class="digit" id="h1">0</span><span class="digit" id="h2">0</span><span class="colon" id="colon">:</span><span class="digit" id="m1">0</span><span class="digit" id="m2">0</span>
          <span class="seconds"><span class="digit" id="s1">0</span><span class="digit" id="s2">0</span></span>
        </div>

        <footer class="bottom">
          <div class="next empty" id="next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span id="nextText">尚未設定提醒</span>
          </div>
        </footer>
      </main>

      <div class="wave" id="wave" aria-hidden="true"></div>

      <!-- Page 2: price notice -->
      <section class="page notice" id="pNotice" aria-label="告示" aria-hidden="true">
        <header class="n-head">
          <h1 id="nTitle">價目表</h1>
          <div class="n-clock" id="nClock" aria-hidden="true">00:00</div>
        </header>
        <ul class="n-items" id="nItems"></ul>
        <footer class="n-foot"><p class="n-note" id="nNote"></p></footer>
      </section>
    </div>
  </div>

  <nav class="dots" aria-label="切換畫面">
    <button id="dot0" aria-label="時鐘" aria-current="true"></button>
    <button id="dot1" aria-label="告示" aria-current="false"></button>
  </nav>

  <div class="actions">
    <button class="icon-btn" id="fsBtn" aria-label="全螢幕">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button class="icon-btn" id="openSettings" aria-label="設定" aria-controls="sheet" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <div class="hint gone" id="hint">輕點畫面一下，啟用提醒聲音與螢幕常亮・左右滑動切換告示</div>

  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" aria-label="設定" aria-hidden="true">
    <div class="sheet-head">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabRem" aria-selected="true" aria-controls="panelRem">提醒</button>
        <button role="tab" id="tabNotice" aria-selected="false" aria-controls="panelNotice">告示</button>
      </div>
      <button class="close" id="closeSettings" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <!-- Reminders -->
    <div class="panel" id="panelRem" role="tabpanel" aria-labelledby="tabRem">
      <form class="add" id="addForm" autocomplete="off">
        <div class="row">
          <label class="field" style="flex:0 0 46%">
            <span>時間</span>
            <input type="time" id="inTime" required />
          </label>
          <label class="field">
            <span>內容（選填）</span>
            <input type="text" id="inLabel" maxlength="24" placeholder="例如：換班" />
          </label>
        </div>
        <div class="seg" role="radiogroup" aria-label="重複">
          <label><input type="radio" name="rep" id="repDaily" value="daily" checked /><span>每天</span></label>
          <label><input type="radio" name="rep" id="repOnce" value="once" /><span>只響一次</span></label>
        </div>
        <button class="primary" type="submit">加入提醒</button>

      <div class="list-title"><h2>已設定</h2><small id="count"></small></div>
      <ul class="list" id="list"></ul>

      <div class="prefs">
        <div class="pref">
          <span>24 小時制</span>
          <button class="switch" id="sw24" role="switch" aria-checked="true" aria-label="24 小時制"></button>
        </div>
        <div class="pref">
          <span>提醒聲音</span>
          <button class="test-btn" id="testBtn" type="button">試聽</button>
        </div>
        <div class="pref">
          <span>離線使用</span>
          <span class="offline" id="offline">檢查中…</span>
        </div>

    <!-- Notice -->
    <div class="panel" id="panelNotice" role="tabpanel" aria-labelledby="tabNotice" hidden>
      <label class="field">
        <span>告示標題</span>
        <input type="text" id="nInTitle" maxlength="16" placeholder="價目表" />
      </label>

      <form class="add" id="itemForm" autocomplete="off">
        <div class="row">
          <label class="field">
            <span>品項</span>
            <input type="text" id="niName" maxlength="16" placeholder="例如：烤香腸" required />
          </label>
          <label class="field" style="flex:0 0 32%">
            <span>價格（元）</span>
            <input type="text" class="num" id="niPrice" maxlength="10" inputmode="numeric" placeholder="35" required />
          </label>
        </div>
        <button class="primary" type="submit" id="itemAdd">加入品項</button>
      </form>

      <div class="list-title"><h2>品項</h2><small id="iCount"></small></div>
      <ul class="ilist" id="iList"></ul>

      <label class="field">
        <span>備註（選填，顯示在告示下方）</span>
        <textarea id="nInNote" maxlength="60" rows="2" placeholder="例如：限現金・收入全數捐作班費"></textarea>
      </label>
      <p class="help">最多 12 項，超過 6 項時自動排成兩欄。修改會立即顯示在告示畫面。</p>
    </div>

  <section class="alarm" id="alarm" role="alertdialog" aria-modal="true" aria-labelledby="aLabel" aria-hidden="true">
    <div class="a-time" id="aTime">00:00</div>
    <div class="a-label" id="aLabel">提醒時間到了</div>
    <div class="a-actions">
      <button class="snooze" id="snoozeBtn">再 5 分鐘</button>
      <button class="ok" id="okBtn">知道了</button>
    </div>
  </section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  const KEY = "orange-clock-v1";
  const MAX_ITEMS = 12;

  // ── Storage (safe) ──
  const load = () => {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  };
  const state = Object.assign({ reminders: [], h24: true, page: 0, notice: null }, load());
  state.notice = Object.assign({ title: "價目表", items: [], note: "" }, state.notice || {});
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  };
  const uid = () => Math.random().toString(36).slice(2, 10);
  const todayKey = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

  // ── Clock rendering ──
  const els = { h1: $("h1"), h2: $("h2"), m1: $("m1"), m2: $("m2"), s1: $("s1"), s2: $("s2") };
  const set = (el, v) => { if (el.textContent !== v) el.textContent = v; };

  function fmtHM(h, m) {
    if (state.h24) return `${pad(h)}:${pad(m)}`;
    return `${h % 12 || 12}:${pad(m)}`;
  }

  function render(now) {
    let h = now.getHours();
    const m = now.getMinutes(), s = now.getSeconds();
    let ap = "";
    if (!state.h24) { ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; }
    const hs = pad(h);
    set(els.h1, hs[0]);
    els.h1.style.display = (!state.h24 && h < 10) ? "none" : "";
    set(els.h2, hs[1]);
    set(els.m1, pad(m)[0]); set(els.m2, pad(m)[1]);
    set(els.s1, pad(s)[0]); set(els.s2, pad(s)[1]);
    $("colon").classList.toggle("dim", s % 2 === 1);
    $("ampm").textContent = state.h24 ? "" : (ap === "AM" ? "上午 AM" : "下午 PM");
    set($("date"), `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日`);
    set($("weekday"), WEEK[now.getDay()]);
    set($("nClock"), fmtHM(now.getHours(), m));
    $("time").setAttribute("aria-label", `目前時間 ${fmtHM(now.getHours(), m)}`);
  }

  // ── Reminder logic ──
  const minutesOf = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };

  function nextReminder(now) {
    const nowMin = now.getHours() * 60 + now.getMinutes();
    let best = null;
    for (const r of state.reminders) {
      if (!r.on) continue;
      if (r.snoozeUntil && r.snoozeUntil > Date.now()) {
        const d = new Date(r.snoozeUntil);
        const delta = (r.snoozeUntil - now.getTime()) / 60000;
        if (!best || delta < best.delta) best = { r, delta, at: fmtHM(d.getHours(), d.getMinutes()), tomorrow: false };
        continue;
      }
      let delta = minutesOf(r.time) - nowMin;
      if (delta < 0 || (delta === 0 && r.lastFired === todayKey(now))) delta += 1440;
      const [h, m] = r.time.split(":").map(Number);
      if (!best || delta < best.delta) best = { r, delta, at: fmtHM(h, m), tomorrow: delta + nowMin >= 1440 };
    }
    return best;
  }

  function renderNext(now) {
    const n = nextReminder(now);
    const box = $("next"), txt = $("nextText");
    if (!n) {
      box.classList.add("empty");
      txt.textContent = state.reminders.length ? "提醒皆已關閉" : "尚未設定提醒";
      return;
    }
    box.classList.remove("empty");
    const mins = Math.ceil(n.delta);
    const rel = mins < 60 ? `${mins} 分鐘後` : `${Math.floor(mins / 60)} 小時 ${mins % 60} 分後`;
    txt.textContent = "";
    const when = document.createElement("span"); when.className = "when";
    when.textContent = (n.tomorrow ? "明天 " : "") + n.at;
    const lbl = document.createElement("span"); lbl.className = "lbl";
    lbl.textContent = ` ${n.r.label ? n.r.label + " · " : ""}${rel}`;
    txt.append(when, lbl);
  }

  let ringing = null, autoStop = 0;

  function check(now) {
    if (ringing) return;
    const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const key = todayKey(now);
    for (const r of state.reminders) {
      if (!r.on) continue;
      if (r.snoozeUntil) {
        if (Date.now() >= r.snoozeUntil) { r.snoozeUntil = 0; save(); fire(r, now); return; }
        continue;
      }
      if (r.time === hm && r.lastFired !== key) {
        r.lastFired = key;
        if (r.repeat === "once") r.on = false;
        save();
        fire(r, now);
        return;
      }
    }
  }

  // ── Alarm takeover ──
  function fire(r, now) {
    ringing = r;
    $("aTime").innerHTML = fmtHM(now.getHours(), now.getMinutes()).replace(":", '<span class="a-colon">:</span>');
    $("aLabel").textContent = r.label || "提醒時間到了";
    document.body.classList.add("alarming");
    $("alarm").setAttribute("aria-hidden", "false");
    closeSettings();
    startTone();
    if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
    setTimeout(() => $("okBtn").focus(), 400);
    autoStop = setTimeout(dismiss, 3 * 60 * 1000);
    renderList();
  }
  function dismiss() {
    clearTimeout(autoStop);
    stopTone();
    ringing = null;
    document.body.classList.remove("alarming");
    $("alarm").setAttribute("aria-hidden", "true");
    tick();
  }
  $("okBtn").onclick = dismiss;
  $("snoozeBtn").onclick = () => {
    const r = state.reminders.find((x) => x.id === ringing?.id);
    if (r) { r.on = true; r.snoozeUntil = Date.now() + 5 * 60 * 1000; save(); }
    dismiss();
    renderList();
  };

  // ── Sound (Web Audio, unlocked on first tap) ──
  let ctx = null, toneTimer = 0;
  function ensureAudio() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
    } catch {}
    return ctx;
  }
  function chime() {
    const c = ensureAudio(); if (!c) return;
    const t0 = c.currentTime;
    [880, 1318.5, 1760].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t + 0.65);
    });
  }
  function startTone() { chime(); clearInterval(toneTimer); toneTimer = setInterval(chime, 1400); }
  function stopTone() { clearInterval(toneTimer); }
  $("testBtn").onclick = () => chime();

  // ── Wake lock & unlock hint ──
  let wakeLock = null, unlocked = false;
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch {}
  }
  const hideHint = () => $("hint").classList.add("gone");
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    const c = ensureAudio();
    try { const o = c.createOscillator(), g = c.createGain(); g.gain.value = 0.0001; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + 0.05); } catch {}
    keepAwake();
    hideHint();
  }
  document.addEventListener("pointerdown", unlock, { capture: true });
  document.addEventListener("keydown", unlock, { capture: true });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); tick(); } });
  setTimeout(() => { if (!unlocked) $("hint").classList.remove("gone"); }, 600);
  setTimeout(hideHint, 12000);

  // ── Fullscreen ──
  const fsEl = document.documentElement;
  const canFs = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
  if (!canFs) $("fsBtn").style.display = "none";
  $("fsBtn").onclick = () => {
    try {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (isFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const p = canFs.call(fsEl); if (p && p.catch) p.catch(() => {}); }
    } catch {}
  };

  // ── Pages & swipe ──
  // pos: 0 = clock, 1 = notice. The finger drives pos directly while dragging;
  // on release a critically damped spring carries it home, keeping the release velocity.
  // The notice is revealed through a liquid edge: a smooth curve that bulges toward
  // the finger and ripples while moving, with a darker wave running just ahead of it.
  const pager = $("pager"), clockEl = $("pClock"), noticeEl = $("pNotice"), shade = $("shade"), wave = $("wave");
  const reduceMQ = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  let page = state.page === 1 ? 1 : 0;
  let pos = page, vel = 0, target = page, edge = 0, raf = 0, last = 0;
  let anchorY = window.innerHeight / 2, dir = 1, drag = null;

  // Smooth closed shape: everything right of the curve x = f(y), as an SVG path.
  function liquidPath(w, h, f) {
    const N = 18, pts = [];
    for (let i = 0; i <= N; i++) { const y = (i / N) * h; pts.push([f(y), y]); }
    let d = `M${w + 4},-4 L${pts[0][0].toFixed(1)},-4 L${pts[0][0].toFixed(1)},0`;
    for (let i = 0; i < N; i++) {           // Catmull-Rom through the samples, as cubic Béziers
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d + ` L${pts[N][0].toFixed(1)},${h + 4} L${w + 4},${h + 4} Z`;
  }

  function paint(now = performance.now()) {
    const w = window.innerWidth, h = window.innerHeight;
    const p = Math.min(1, Math.max(0, pos));
    if (reduceMQ.matches) {
      clockEl.style.transform = noticeEl.style.transform = noticeEl.style.clipPath = "";
      noticeEl.style.opacity = p >= 0.5 ? "1" : "0";
      noticeEl.style.visibility = p >= 0.5 ? "visible" : "hidden";
      wave.style.visibility = "hidden";
      shade.style.opacity = "0";
    } else {
      noticeEl.style.opacity = "";
      clockEl.style.transform = `translate3d(${-p * w * 0.12}px,0,0) scale(${1 - 0.05 * p})`;
      shade.style.opacity = String(0.22 * p);

      const swell = Math.sin(Math.PI * p);                 // 0 at rest, 1 mid-way
      const bulge = Math.min(w * 0.2, 220) * swell * dir;   // lobe leads in the direction of travel
      const R = h * 0.34;
      const t = now / 1000;
      const edgeX = (1 - p) * (w + 40) - 20 * swell;
      const f = (lead, amp, phase) => (y) => {
        const g = Math.exp(-(((y - anchorY) / R) ** 2));
        const ripple = amp * swell * Math.sin((y / h) * Math.PI * 3 + t * 5 + phase);
        return edgeX - lead * swell - bulge * g - ripple;
      };
      if (p >= 0.999) {
        noticeEl.style.clipPath = "";
        noticeEl.style.visibility = "visible";
        wave.style.visibility = "hidden";
      } else if (p <= 0.0005) {
        noticeEl.style.visibility = "hidden";
        wave.style.visibility = "hidden";
      } else {
        noticeEl.style.visibility = "visible";
        noticeEl.style.clipPath = `path("${liquidPath(w, h, f(0, 12, 0))}")`;
        wave.style.visibility = "visible";
        wave.style.clipPath = `path("${liquidPath(w, h, (y) => f(34, 16, 1.4)(y) - bulge * 0.12 * Math.exp(-(((y - anchorY) / R) ** 2)))}")`;
      }
      // Content flows in after the edge: title first, then each row a beat later.
      const lag = (1 - p) * w;
      $("nTitle").parentElement.style.transform = `translate3d(${lag * 0.1}px,0,0)`;
      [...$("nItems").children].forEach((li, i) => {
        li.style.transform = `translate3d(${lag * (0.14 + 0.03 * i)}px,0,0)`;
      });
      $("nNote").style.transform = `translate3d(${lag * 0.3}px,0,0)`;
    }
    const onClock = p < 0.5;
    clockEl.style.setProperty("--edge", onClock ? `${edge}px` : "0px");
    noticeEl.style.setProperty("--edge", onClock ? "0px" : `${edge}px`);
    // Indicator: the pill stretches between the dots with the finger.
    $("dot0").style.setProperty("--w", `${32 - 20 * p}px`);
    $("dot0").style.setProperty("--o", String(1 - 0.7 * p));
    $("dot1").style.setProperty("--w", `${12 + 20 * p}px`);
    $("dot1").style.setProperty("--o", String(0.3 + 0.7 * p));
  }

  function settle() {
    pager.classList.remove("moving");
    const changed = page !== target;
    page = target;
    clockEl.setAttribute("aria-hidden", String(page !== 0));
    noticeEl.setAttribute("aria-hidden", String(page !== 1));
    clockEl.inert = page !== 0; noticeEl.inert = page !== 1;
    $("dot0").setAttribute("aria-current", String(page === 0));
    $("dot1").setAttribute("aria-current", String(page === 1));
    if (changed) { state.page = page; save(); }
  }

  // One frame loop for both dragging (keeps the ripples flowing) and the spring.
  function frame(now) {
    const dt = Math.min(0.034, (now - last) / 1000);
    last = now;
    if (!drag) {
      const k = 150, c = 2 * Math.sqrt(k);            // critically damped: no overshoot
      vel += (-k * (pos - target) - c * vel) * dt;
      pos += vel * dt;
      edge *= Math.exp(-dt * 16);
      if (Math.abs(pos - target) < 0.0008 && Math.abs(vel) < 0.01 && Math.abs(edge) < 0.5) {
        pos = target; vel = 0; edge = 0; raf = 0;
        paint(now); settle();
        return;
      }
    }
    paint(now);
    raf = requestAnimationFrame(frame);
  }
  function run() {
    pager.classList.add("moving");
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }

  function animateTo(t, v0 = vel) {
    target = Math.max(0, Math.min(1, t));
    if (target !== pos) dir = target > pos ? 1 : -1;
    if (reduceMQ.matches) { pos = target; vel = 0; edge = 0; paint(); settle(); return; }
    vel = v0;
    run();
  }
  const go = (p) => { anchorY = window.innerHeight / 2; animateTo(p, 0); };
  $("dot0").onclick = () => go(0);
  $("dot1").onclick = () => go(1);

  const blocked = () => ringing || document.body.classList.contains("settings-open");
  pager.addEventListener("pointerdown", (e) => {
    if (blocked() || e.button > 0) return;
    drag = { x: e.clientX, y: e.clientY, startPos: pos, active: false, samples: [[e.clientX, e.timeStamp]] };
  });
  window.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.active) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag.active = true; vel = 0; run(); }
      else if (Math.abs(dy) > 14) { drag = null; return; }
      else return;
    }
    drag.samples.push([e.clientX, e.timeStamp]);
    if (drag.samples.length > 5) drag.samples.shift();
    anchorY += (e.clientY - anchorY) * 0.5;      // the bulge follows the finger, softly
    const raw = drag.startPos - dx / window.innerWidth;
    const next = Math.max(0, Math.min(1, raw));
    if (next !== pos) dir = next > pos ? 1 : -1;
    pos = next;
    // Rubber band past either end: the content resists instead of the card leaving.
    const over = (raw - pos) * -window.innerWidth;
    edge = over === 0 ? 0 : Math.sign(over) * Math.min(80, Math.abs(over) * 0.35);
    if (reduceMQ.matches) { cancelAnimationFrame(raf); raf = 0; }
  });
  const endDrag = (e) => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.active) return;
    const [x0, t0] = d.samples[0], [x1, t1] = d.samples[d.samples.length - 1];
    const stale = e && e.timeStamp - t1 > 80;                   // finger paused before lifting
    const vpx = !stale && t1 > t0 ? (x1 - x0) / (t1 - t0) : 0;  // px per ms, + = rightward
    const v = (-vpx * 1000) / window.innerWidth;                 // pos units per second
    let next;
    if (Math.abs(vpx) > 0.35) next = vpx < 0 ? 1 : 0;            // a flick decides on its own
    else next = pos + v * 0.12 > 0.5 ? 1 : 0;
    animateTo(next, Math.abs(vpx) > 0.35 ? v : 0);
  };
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", () => paint());
  if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", () => paint());

  // ── Notice rendering ──
  function priceParts(p) {
    const s = String(p).trim();
    return /^\d+$/.test(s) ? { num: s, unit: "元" } : { num: s, unit: "" };
  }
  function renderNotice() {
    const n = state.notice;
    $("nTitle").textContent = n.title.trim() || "價目表";
    $("nNote").textContent = n.note.trim();
    const ul = $("nItems");
    ul.textContent = "";
    if (!n.items.length) {
      const li = document.createElement("li");
      li.className = "n-empty";
      li.textContent = "尚未設定價目。點右下角的設定，在「告示」加入品項。";
      ul.append(li);
      ul.style.setProperty("--cols", 1); ul.style.setProperty("--rows", 1);
      return;
    }
    for (const it of n.items) {
      const li = document.createElement("li");
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = it.name;
      const pr = document.createElement("span"); pr.className = "pr";
      const { num, unit } = priceParts(it.price);
      pr.textContent = num;
      if (unit) { const u = document.createElement("span"); u.className = "unit"; u.textContent = unit; pr.append(u); }
      li.append(nm, pr);
      ul.append(li);
    }
    fitNotice();
    if (typeof paint === "function") paint();
  }
  function fitNotice() {
    const ul = $("nItems");
    const count = state.notice.items.length;
    if (!count) return;
    const cols = count > 6 ? 2 : 1;
    const rows = Math.ceil(count / cols);
    ul.style.setProperty("--cols", cols);
    ul.style.setProperty("--rows", rows);
    const avail = ul.clientHeight || window.innerHeight * 0.55;
    const byHeight = avail / rows / 1.75;
    const byWidth = window.innerWidth * (cols === 1 ? 0.058 : 0.044);
    ul.style.setProperty("--ifs", `${Math.max(22, Math.min(byHeight, byWidth, 88))}px`);
  }
  window.addEventListener("resize", fitNotice);

  // ── Notice editor ──
  $("nInTitle").value = state.notice.title;
  $("nInNote").value = state.notice.note;
  $("nInTitle").addEventListener("input", (e) => { state.notice.title = e.target.value; save(); renderNotice(); });
  $("nInNote").addEventListener("input", (e) => { state.notice.note = e.target.value; save(); renderNotice(); });

  $("itemForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("niName").value.trim(), price = $("niPrice").value.trim();
    if (!name) { $("niName").focus(); return; }
    if (!price) { $("niPrice").focus(); return; }
    if (state.notice.items.length >= MAX_ITEMS) return;
    state.notice.items.push({ id: uid(), name, price });
    save();
    $("niName").value = ""; $("niPrice").value = "";
    $("niName").focus();
    renderItems(); renderNotice();
  });

  const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>';
  const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

  function renderItems() {
    const items = state.notice.items;
    const ul = $("iList");
    ul.textContent = "";
    $("iCount").textContent = `${items.length} / ${MAX_ITEMS} 項`;
    $("itemAdd").disabled = items.length >= MAX_ITEMS;
    $("itemAdd").textContent = items.length >= MAX_ITEMS ? "已達 12 項上限" : "加入品項";
    if (!items.length) {
      const li = document.createElement("li");
      li.className = "empty-list"; li.style.display = "block";
      li.textContent = "還沒有品項。在上方輸入品項與價格，按「加入品項」。";
      ul.append(li);
      return;
    }
    items.forEach((it, i) => {
      const li = document.createElement("li");
      const nm = document.createElement("input");
      nm.type = "text"; nm.maxLength = 16; nm.value = it.name; nm.id = `in-${it.id}`;
      nm.setAttribute("aria-label", `第 ${i + 1} 項名稱`);
      nm.oninput = () => { it.name = nm.value; save(); renderNotice(); };
      const pr = document.createElement("input");
      pr.type = "text"; pr.className = "num"; pr.maxLength = 10; pr.inputMode = "numeric"; pr.value = it.price; pr.id = `ip-${it.id}`;
      pr.setAttribute("aria-label", `第 ${i + 1} 項價格`);
      pr.oninput = () => { it.price = pr.value; save(); renderNotice(); };
      const up = document.createElement("button");
      up.className = "del"; up.type = "button"; up.innerHTML = ICON_UP; up.disabled = i === 0;
      up.setAttribute("aria-label", `將 ${it.name} 往上移`);
      up.onclick = () => { items.splice(i - 1, 0, items.splice(i, 1)[0]); save(); renderItems(); renderNotice(); };
      const del = document.createElement("button");
      del.className = "del"; del.type = "button"; del.innerHTML = ICON_DEL;
      del.setAttribute("aria-label", `刪除 ${it.name}`);
      del.onclick = () => { state.notice.items = items.filter((x) => x.id !== it.id); save(); renderItems(); renderNotice(); };
      li.append(nm, pr, up, del);
      ul.append(li);
    });
  }

  // ── Settings sheet ──
  function showTab(which) {
    const rem = which === "rem";
    $("tabRem").setAttribute("aria-selected", String(rem));
    $("tabNotice").setAttribute("aria-selected", String(!rem));
    $("panelRem").hidden = !rem;
    $("panelNotice").hidden = rem;
  }
  $("tabRem").onclick = () => showTab("rem");
  $("tabNotice").onclick = () => showTab("notice");

  function openSettings() {
    document.body.classList.add("settings-open");
    $("sheet").setAttribute("aria-hidden", "false");
    $("openSettings").setAttribute("aria-expanded", "true");
    showTab(page === 1 ? "notice" : "rem");
    if (!$("inTime").value) {
      const d = new Date(Date.now() + 60 * 60 * 1000);
      $("inTime").value = `${pad(d.getHours())}:00`;
    }
  }
  function closeSettings() {
    document.body.classList.remove("settings-open");
    $("sheet").setAttribute("aria-hidden", "true");
    $("openSettings").setAttribute("aria-expanded", "false");
    if (document.activeElement && $("sheet").contains(document.activeElement)) document.activeElement.blur();
  }
  $("openSettings").onclick = openSettings;
  $("closeSettings").onclick = closeSettings;
  $("scrim").onclick = closeSettings;
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (ringing) dismiss(); else closeSettings(); return; }
    if (blocked() || /INPUT|TEXTAREA/.test(document.activeElement?.tagName || "")) return;
    if (e.key === "ArrowRight") go(target + 1);
    if (e.key === "ArrowLeft") go(target - 1);
  });

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const time = $("inTime").value;
    if (!/^\d{2}:\d{2}$/.test(time)) { $("inTime").focus(); return; }
    const repeat = document.querySelector('input[name="rep"]:checked').value;
    state.reminders.push({ id: uid(), time, label: $("inLabel").value.trim(), repeat, on: true, lastFired: "" });
    state.reminders.sort((a, b) => minutesOf(a.time) - minutesOf(b.time));
    save();
    $("inLabel").value = "";
    renderList(); tick();
  });

  function renderList() {
    const ul = $("list");
    ul.textContent = "";
    $("count").textContent = state.reminders.length ? `${state.reminders.filter((r) => r.on).length} / ${state.reminders.length} 個啟用中` : "";
    if (!state.reminders.length) {
      const li = document.createElement("li");
      li.className = "empty-list"; li.style.display = "block"; li.style.border = "0";
      li.textContent = "還沒有提醒。在上方選好時間，按「加入提醒」即可。";
      ul.append(li);
      return;
    }
    for (const r of state.reminders) {
      const li = document.createElement("li");
      if (!r.on) li.classList.add("off");
      const [h, m] = r.time.split(":").map(Number);
      const left = document.createElement("div");
      const t = document.createElement("div"); t.className = "t"; t.textContent = fmtHM(h, m) + (state.h24 ? "" : (h < 12 ? " AM" : " PM"));
      const meta = document.createElement("span"); meta.className = "meta";
      const snoozed = r.snoozeUntil && r.snoozeUntil > Date.now();
      meta.textContent = [r.label, r.repeat === "daily" ? "每天" : "只響一次", snoozed ? "貪睡中" : ""].filter(Boolean).join(" · ");
      left.append(t, meta);

      const sw = document.createElement("button");
      sw.className = "switch"; sw.setAttribute("role", "switch");
      sw.setAttribute("aria-checked", String(!!r.on));
      sw.setAttribute("aria-label", `${r.time} ${r.on ? "已啟用" : "已關閉"}`);
      sw.onclick = () => {
        r.on = !r.on; r.snoozeUntil = 0;
        if (r.on && r.repeat === "once") r.lastFired = "";
        save(); renderList(); tick();
      };

      const del = document.createElement("button");
      del.className = "del"; del.setAttribute("aria-label", `刪除 ${r.time} 的提醒`);
      del.innerHTML = ICON_DEL;
      del.onclick = () => {
        state.reminders = state.reminders.filter((x) => x.id !== r.id);
        save(); renderList(); tick();
      };
      li.append(left, sw, del);
      ul.append(li);
    }
  }

  const sw24 = $("sw24");
  sw24.setAttribute("aria-checked", String(state.h24));
  sw24.onclick = () => {
    state.h24 = !state.h24;
    sw24.setAttribute("aria-checked", String(state.h24));
    save(); renderList(); tick();
  };

  // ── Tick, aligned to the wall-clock second ──
  function tick() {
    const now = new Date();
    render(now);
    check(now);
    renderNext(now);
  }
  function loop() {
    tick();
    setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
  }

  target = page; paint(); settle();
  renderList();
  renderItems();
  renderNotice();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNotice);
  loop();

  // ── Offline: service worker precaches the page, fonts and icons ──
  const offlineEl = $("offline");
  function setOffline(text, ready) { offlineEl.textContent = text; offlineEl.classList.toggle("ready", !!ready); }
  async function checkOffline() {
    try {
      const hit = await caches.match("fonts/chiron-goround-tc.woff2");
      setOffline(hit ? "已可離線使用" : "下載中，請保持連線", !!hit);
      if (!hit) setTimeout(checkOffline, 3000);
    } catch { setOffline("無法檢查", false); }
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(checkOffline)
      .catch(() => setOffline("此網址不支援離線", false));
  } else {
    setOffline("需從網址開啟才能離線", false);
  }
})();
</script>
</body>
</html>
