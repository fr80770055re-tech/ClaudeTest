<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="橘子時鐘" />
<meta name="theme-color" content="#D9500F" />
<title>橘子時鐘</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<style>
  /* @fonts-begin: self-hosted so the clock works offline (subset: Latin; Big5 Traditional Chinese) */
  @font-face {
    font-family: "Archivo";
    src: url("fonts/archivo.woff2") format("woff2");
    font-weight: 300 900; font-stretch: 100% 125%; font-display: swap;
  }
  @font-face {
    font-family: "Chiron GoRound TC";
    src: url("fonts/chiron-goround-tc.woff2") format("woff2");
    font-weight: 500 900; font-display: swap;
  }
  /* @fonts-end */
  /* Layout: two full-screen pages side by side (clock / price notice), swiped horizontally; teacher controls in a side sheet. */
  :root {
    --orange: #D9500F;
    --orange-deep: #B8420B;
    --orange-ink: #7A2A05;
    --floater: #1A0B04;      /* warm black for the ambient dots and strokes */
    --orange-recess: #C4470D;
    --key: #B8420B;          /* digit keys: deep orange, cream numerals ≈ 5:1 */
    --key-press: #9E380A;
    --cream-press: #E9DCC6; /* orange under the 22% shade: what shows behind the receding clock */
    --cream: #F7EFE2;
    --cream-dim: rgba(247, 239, 226, .93);
    --cream-line: rgba(247, 239, 226, .28);
    --sheet: #F7EFE2;
    --sheet-ink: #4A1C04;
    --sheet-muted: #8A4A22;
    --sheet-line: #E6D6BF;
    --field: #FFFAF2;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --latin: "Archivo", "Chiron GoRound TC", system-ui, sans-serif;
    --han: "Chiron GoRound TC", "Archivo", "PingFang TC", system-ui, sans-serif;
    --pad-x: max(4.2vw, env(safe-area-inset-left, 0px));
    --pad-r: max(4.2vw, env(safe-area-inset-right, 0px));
    --pad-t: max(3.2vh, env(safe-area-inset-top, 0px));
    --pad-b: max(3.6vh, env(safe-area-inset-bottom, 0px));
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--orange);
    color: var(--cream);
    font-family: var(--han);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--cream); color: var(--orange); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; border-radius: 12px; }

  /* ─── Pager ─── */
  .pager { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: var(--orange-recess); }
  .track { position: absolute; inset: 0; }
  /* The notice is a card stacked on the clock: it slides over it while the clock recedes. */
  .page {
    position: absolute; inset: 0;
    background: var(--orange);
    transform-origin: 50% 50%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-x);
  }

  .top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: clamp(24px, 2.6vw, 34px);
    font-weight: 700;
    letter-spacing: .02em;
  }
  .top .weekday { color: var(--cream-dim); font-weight: 500; margin-left: .6em; }
  .top .ampm {
    font-family: var(--latin);
    font-variation-settings: "wdth" 112;
    font-weight: 700;
    letter-spacing: .08em;
  }

  /* ─── Time ─── */
  .time {
    align-self: center; justify-self: center;
    display: flex; align-items: flex-start;
    font-family: var(--latin);
    font-weight: 800;
    font-variation-settings: "wdth" 118;
    line-height: .8;
    letter-spacing: -.02em;
    font-size: min(23.5vw, 54vh);
    margin-top: -2vh;
  }
  .digit { display: inline-block; width: .7em; text-align: center; }
  .colon {
    display: inline-block; width: .42em; text-align: center;
    transform: translateY(-.06em);
    transition: opacity .6s var(--ease);
  }
  .colon.dim { opacity: .35; }
  .seconds {
    font-size: .2em; font-weight: 600;
    font-variation-settings: "wdth" 100;
    color: var(--cream-dim);
    margin-left: .35em; margin-top: .12em;
    letter-spacing: 0;
  }
  .seconds .digit { width: .6em; }

  /* ─── Bottom row (clock page) ─── */
  .bottom { min-height: 64px; display: flex; align-items: center; padding-right: 160px; }
  .next {
    display: flex; align-items: center; gap: 14px;
    font-size: clamp(24px, 2.4vw, 30px);
    font-weight: 700;
    max-width: calc(50vw - 80px);
    min-width: 0;
  }
  .next svg { width: 1.15em; height: 1.15em; flex: none; }
  .next #nextText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .next .when { font-family: var(--latin); font-variation-settings: "wdth" 110; font-weight: 700; }
  .next .lbl { color: var(--cream-dim); font-weight: 500; }
  .next.empty { color: var(--cream-dim); font-weight: 500; }

  /* ─── Notice page ─── */
  .page > :not(.shade):not(.fx) { translate: var(--edge, 0px) 0; position: relative; z-index: 1; }
  .shade { position: absolute; inset: 0; z-index: 2; background: var(--orange-ink); opacity: 0; pointer-events: none; }
  /* Ambient floaters: drawn behind each page's content, so they never cover text. */
  .fx { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
  /* The notice pours in over the clock through a liquid edge (clip-path), led by a darker wave. */
  .notice { gap: 3vh; z-index: 2; }
  .wave { position: absolute; inset: 0; z-index: 1; background: var(--orange-deep); visibility: hidden; pointer-events: none; }
  .pager.moving .page, .pager.moving .wave, .pager.moving .n-items li { will-change: transform, clip-path; }

  /* ─── Calculator page: keypad left, readout right (clear of the fixed buttons) ─── */
  .calc {
    z-index: 2;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    column-gap: 4vw;
    padding-bottom: calc(var(--pad-b) + 84px);
  }
  .c-keys {
    display: grid; min-height: 0;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: clamp(10px, 1.3vw, 16px);
  }
  .c-key {
    border: 0; border-radius: clamp(16px, 1.9vw, 24px);
    background: var(--key); color: var(--cream);
    font-family: var(--latin); font-weight: 700; font-variation-settings: "wdth" 110;
    font-size: clamp(28px, 3.3vw, 46px); line-height: 1;
    display: grid; place-items: center;
    touch-action: manipulation;
    transition: transform .12s var(--ease), background-color .12s var(--ease), color .12s var(--ease);
  }
  .c-key svg { width: 1.05em; height: 1.05em; }
  .c-key:active { transform: scale(.95); background: var(--key-press); }
  .c-key.fn { background: transparent; box-shadow: inset 0 0 0 2px var(--cream-line); }
  .c-key.fn:active { background: rgba(247, 239, 226, .14); }
  .c-key.op, .c-key.eq { background: var(--cream); color: var(--orange); font-size: clamp(34px, 4vw, 56px); font-weight: 600; }
  .c-key.op:active, .c-key.eq:active { background: var(--cream-press); }
  .c-key.op[aria-pressed="true"] { background: var(--orange-ink); color: var(--cream); }
  .c-key.eq { grid-row: span 2; color: var(--orange-ink); }
  .c-display {
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;
    gap: 1.2vh; min-width: 0; padding-bottom: 1vh; text-align: right;
  }
  .c-expr {
    font-family: var(--latin); font-weight: 600; font-variation-settings: "wdth" 104;
    font-size: clamp(24px, 2.7vw, 36px); color: var(--cream-dim);
    white-space: nowrap; overflow: hidden; max-width: 100%; min-height: 1.25em;
    font-variant-numeric: tabular-nums;
  }
  .c-out {
    display: block; max-width: 100%;
    font-family: var(--latin); font-weight: 800; font-variation-settings: "wdth" 116;
    font-size: var(--out-size, min(10vw, 19vh)); line-height: 1; letter-spacing: -.01em;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .c-out.err { font-family: var(--han); font-weight: 900; font-size: clamp(36px, 4.6vw, 64px); }
  .n-head { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; min-width: 0; }
  .n-head h1 {
    margin: 0; min-width: 0;
    font-size: clamp(40px, 6vw, 84px);
    font-weight: 900; letter-spacing: .04em; line-height: 1.1;
    overflow-wrap: anywhere;
  }
  .n-clock {
    flex: none;
    font-family: var(--latin); font-weight: 800; font-variation-settings: "wdth" 116;
    font-size: clamp(32px, 4vw, 56px); line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--cream-dim);
  }
  .n-items {
    list-style: none; margin: 0; padding: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
    grid-auto-flow: column;
    grid-template-rows: repeat(var(--rows, 1), auto);
    column-gap: 6vw;
    align-content: center;
    font-size: var(--ifs, 48px);
  }
  .n-items li {
    display: flex; align-items: baseline; gap: .6em;
    padding: .28em 0;
    border-bottom: 2px solid var(--cream-line);
    min-width: 0;
  }
  .n-items .nm { flex: 1; min-width: 0; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .n-items .pr {
    flex: none;
    font-family: var(--latin); font-weight: 800; font-variation-settings: "wdth" 112;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .n-items .unit { font-family: var(--han); font-weight: 700; font-size: .5em; margin-left: .15em; color: var(--cream-dim); }
  .n-items li.n-empty {
    display: block; border: 0; font-size: clamp(24px, 2.6vw, 34px); font-weight: 500;
    color: var(--cream-dim); text-align: center; line-height: 1.6;
  }
  .n-foot { min-height: 64px; display: flex; align-items: center; padding-right: 160px; }
  .n-note { margin: 0; font-size: clamp(24px, 2.6vw, 34px); font-weight: 700; color: var(--cream-dim); line-height: 1.3; max-width: calc(50vw - 100px); overflow-wrap: anywhere; }

  /* ─── Fixed chrome ─── */
  .dots {
    position: fixed; left: 50%; bottom: var(--pad-b);
    transform: translateX(-50%);
    display: flex; gap: 4px; height: 64px; align-items: center;
  }
  .dots button {
    width: 44px; height: 44px; border: 0; background: transparent; padding: 0;
    display: grid; place-items: center;
  }
  .dots button::before {
    content: ""; width: var(--w, 12px); height: 12px; border-radius: 6px;
    background: var(--cream); opacity: var(--o, .3);
  }

  .actions {
    position: fixed; right: var(--pad-r); bottom: var(--pad-b);
    display: flex; gap: 14px;
  }
  .icon-btn {
    width: 64px; height: 64px;
    display: grid; place-items: center;
    background: transparent;
    border: 2px solid var(--cream-line);
    border-radius: 50%;
    transition: background .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  }
  .icon-btn svg { width: 28px; height: 28px; }
  .icon-btn:hover { border-color: var(--cream); }
  .icon-btn:active { transform: scale(.94); background: rgba(247,239,226,.12); }

  .hint {
    position: fixed; left: 50%; top: var(--pad-t);
    transform: translate(-50%, 0);
    background: var(--cream); color: var(--orange-ink);
    font-size: 18px; font-weight: 700; white-space: nowrap;
    padding: 12px 22px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(74, 28, 4, .25);
    transition: opacity .5s var(--ease), transform .5s var(--ease);
  }
  .hint.gone { opacity: 0; transform: translate(-50%, -16px); pointer-events: none; }

  /* ─── Settings sheet ─── */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(74, 28, 4, .35);
    opacity: 0; pointer-events: none;
    transition: opacity .45s var(--ease);
  }
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(480px, 92vw);
    background: var(--sheet); color: var(--sheet-ink);
    padding:
      max(24px, env(safe-area-inset-top, 0px))
      max(28px, env(safe-area-inset-right, 0px))
      max(24px, env(safe-area-inset-bottom, 0px))
      28px;
    display: flex; flex-direction: column; gap: 20px;
    transform: translateX(110%);
    visibility: hidden;
    transition: transform .55s var(--ease), visibility 0s linear .55s;
    box-shadow: -12px 0 40px rgba(74, 28, 4, .25);
    -webkit-user-select: auto; user-select: auto;
  }
  body.settings-open .scrim { opacity: 1; pointer-events: auto; }
  body.settings-open .sheet { transform: none; visibility: visible; transition: transform .55s var(--ease), visibility 0s; }
  .sheet ::selection { background: var(--orange); color: var(--cream); }
  .sheet :focus-visible { outline-color: var(--orange); }

  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .tabs { display: flex; gap: 22px; }
  .tabs button {
    border: 0; background: transparent; padding: 6px 0;
    font-size: 28px; font-weight: 900; letter-spacing: .02em;
    color: #B07A55;
    border-bottom: 3px solid transparent;
    transition: color .25s var(--ease), border-color .25s var(--ease);
  }
  .tabs button[aria-selected="true"] { color: var(--sheet-ink); border-bottom-color: var(--orange); }
  .close {
    width: 48px; height: 48px; border-radius: 50%;
    border: 0; background: var(--sheet-line);
    display: grid; place-items: center; flex: none;
  }
  .close svg { width: 22px; height: 22px; }

  .panel {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 20px;
    margin-right: -12px; padding-right: 12px;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: var(--sheet-line); border-radius: 3px; }
  .panel[hidden] { display: none; }

  form.add { display: grid; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--sheet-line); }
  .row { display: flex; gap: 12px; }
  .field { display: grid; gap: 6px; flex: 1; min-width: 0; }
  .field > span { font-size: 15px; font-weight: 700; color: var(--sheet-muted); }
  input[type="time"], input[type="text"], textarea {
    width: 100%;
    font: inherit;
    font-size: 20px; font-weight: 700;
    color: var(--sheet-ink);
    background: var(--field);
    border: 2px solid var(--sheet-line);
    border-radius: 14px;
    padding: 12px 14px;
    min-height: 56px;
    caret-color: var(--orange);
    -webkit-appearance: none; appearance: none;
    transition: border-color .25s var(--ease);
  }
  textarea { resize: none; line-height: 1.4; min-height: 84px; }
  input[type="time"], input.num { font-family: var(--latin); font-variation-settings: "wdth" 108; }
  input::placeholder, textarea::placeholder { color: #B07A55; font-weight: 500; }
  input:focus, textarea:focus { outline: none; border-color: var(--orange); }

  .seg {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--sheet-line); border-radius: 14px; padding: 4px;
  }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .seg span {
    display: grid; place-items: center;
    min-height: 48px; border-radius: 10px;
    font-size: 17px; font-weight: 700; color: var(--sheet-muted);
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .seg input:checked + span { background: var(--field); color: var(--sheet-ink); box-shadow: 0 2px 6px rgba(74,28,4,.12); }
  .seg input:focus-visible + span { outline: 3px solid var(--orange); outline-offset: 2px; }

  .primary {
    min-height: 58px; border: 0; border-radius: 14px;
    background: var(--orange); color: var(--cream);
    font-size: 20px; font-weight: 900; letter-spacing: .06em;
    transition: background .25s var(--ease), transform .25s var(--ease), opacity .25s var(--ease);
  }
  .primary:hover { background: var(--orange-deep); }
  .primary:active { transform: scale(.98); }
  .primary:disabled { opacity: .45; cursor: not-allowed; }

  .list-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0; }
  .list-title h2 { margin: 0; font-size: 17px; font-weight: 900; }
  .list-title small { color: var(--sheet-muted); font-size: 15px; font-weight: 500; }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--sheet-line);
  }
  .list .t {
    font-family: var(--latin); font-variation-settings: "wdth" 112;
    font-size: 34px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .list .meta { display: block; margin-top: 6px; font-size: 15px; color: var(--sheet-muted); font-weight: 500; }
  .list li.off .t, .list li.off .meta { opacity: .45; }

  .ilist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .ilist li { display: grid; grid-template-columns: 1fr 104px auto auto; gap: 8px; align-items: center; }
  .ilist input { min-height: 48px; padding: 8px 12px; font-size: 18px; }

  .switch {
    width: 58px; height: 34px; border-radius: 999px; border: 0;
    background: var(--sheet-line); position: relative; padding: 0;
    transition: background .3s var(--ease);
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 28px; height: 28px; border-radius: 50%; background: var(--field);
    box-shadow: 0 2px 4px rgba(74,28,4,.2);
    transition: transform .3s var(--ease);
  }
  .switch[aria-checked="true"] { background: var(--orange); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); }

  .del {
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: transparent; color: var(--sheet-muted);
    display: grid; place-items: center;
  }
  .del svg { width: 22px; height: 22px; }
  .del:hover { background: var(--sheet-line); color: var(--sheet-ink); }
  .del:disabled { opacity: .3; cursor: default; background: transparent; }

  .empty-list { color: var(--sheet-muted); font-size: 16px; line-height: 1.6; padding: 14px 0; }

  .prefs { display: grid; gap: 10px; padding-top: 4px; border-top: 1px solid var(--sheet-line); margin-top: auto; }
  .pref { display: flex; justify-content: space-between; align-items: center; min-height: 48px; font-size: 17px; font-weight: 700; }
  .test-btn {
    border: 2px solid var(--sheet-line); background: transparent; border-radius: 12px;
    padding: 8px 14px; font-size: 15px; font-weight: 700; color: var(--sheet-ink); min-height: 44px;
  }
  .offline { font-size: 15px; font-weight: 700; color: var(--sheet-muted); }
  .offline.ready { color: #2F6B1F; }
  .help { margin: 0; font-size: 15px; color: var(--sheet-muted); line-height: 1.6; }

  /* ─── Alarm takeover ─── */
  .alarm {
    position: fixed; inset: 0;
    background: var(--cream); color: var(--orange);
    display: grid; place-items: center; align-content: center; gap: 4vh;
    text-align: center;
    clip-path: circle(0% at 50% 50%);
    transition: clip-path .7s var(--ease);
    pointer-events: none;
  }
  body.alarming .alarm { clip-path: circle(150% at 50% 50%); pointer-events: auto; }
  .alarm .a-time {
    font-family: var(--latin); font-weight: 800; font-variation-settings: "wdth" 118;
    font-size: min(24vw, 40vh); line-height: .85; letter-spacing: -.02em;
  }
  .alarm .a-label { font-size: clamp(30px, 4.6vw, 64px); font-weight: 900; color: var(--orange-ink); max-width: 80vw; overflow-wrap: anywhere; }
  .alarm .a-actions { display: flex; gap: 18px; margin-top: 2vh; }
  .alarm button {
    min-width: 200px; min-height: 72px; border-radius: 999px;
    font-size: 24px; font-weight: 900; letter-spacing: .06em;
    transition: transform .25s var(--ease);
  }
  .alarm button:active { transform: scale(.96); }
  .alarm .ok { background: var(--orange); color: var(--cream); border: 0; }
  .alarm .snooze { background: transparent; color: var(--orange); border: 3px solid var(--orange); }
  .alarm :focus-visible { outline-color: var(--orange); }
  .alarm .a-colon { display: inline-block; margin: 0 .09em; transform: translateY(-.05em); }
  body.alarming .alarm .a-time { animation: pulse 1.2s var(--ease) infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  @media (orientation: portrait) {
    .calc { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); row-gap: 3vh; }
    .calc .c-display { order: -1; }
    .time { font-size: min(30vw, 34vh); flex-wrap: wrap; justify-content: center; }

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  const KEY = "orange-clock-v1";
  const MAX_ITEMS = 12;

  // ── Storage (safe) ──
  const load = () => {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  };
  const state = Object.assign({ reminders: [], h24: true, page: 0, notice: null }, load());
  state.notice = Object.assign({ title: "價目表", items: [], note: "" }, state.notice || {});
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  };
  const uid = () => Math.random().toString(36).slice(2, 10);
  const todayKey = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

  // ── Clock rendering ──
  const els = { h1: $("h1"), h2: $("h2"), m1: $("m1"), m2: $("m2"), s1: $("s1"), s2: $("s2") };
  const set = (el, v) => { if (el.textContent !== v) el.textContent = v; };

  function fmtHM(h, m) {
    if (state.h24) return `${pad(h)}:${pad(m)}`;
    return `${h % 12 || 12}:${pad(m)}`;
  }

  function render(now) {
    let h = now.getHours();
    const m = now.getMinutes(), s = now.getSeconds();
    let ap = "";
    if (!state.h24) { ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; }
    const hs = pad(h);
    set(els.h1, hs[0]);
    els.h1.style.display = (!state.h24 && h < 10) ? "none" : "";
    set(els.h2, hs[1]);
    set(els.m1, pad(m)[0]); set(els.m2, pad(m)[1]);
    set(els.s1, pad(s)[0]); set(els.s2, pad(s)[1]);
    $("colon").classList.toggle("dim", s % 2 === 1);
    $("ampm").textContent = state.h24 ? "" : (ap === "AM" ? "上午 AM" : "下午 PM");
    set($("date"), `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日`);
    set($("weekday"), WEEK[now.getDay()]);
    set($("nClock"), fmtHM(now.getHours(), m));
    $("time").setAttribute("aria-label", `目前時間 ${fmtHM(now.getHours(), m)}`);
  }

  // ── Reminder logic ──
  const minutesOf = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };

  function nextReminder(now) {
    const nowMin = now.getHours() * 60 + now.getMinutes();
    let best = null;
    for (const r of state.reminders) {
      if (!r.on) continue;
      if (r.snoozeUntil && r.snoozeUntil > Date.now()) {
        const d = new Date(r.snoozeUntil);
        const delta = (r.snoozeUntil - now.getTime()) / 60000;
        if (!best || delta < best.delta) best = { r, delta, at: fmtHM(d.getHours(), d.getMinutes()), tomorrow: false };
        continue;
      }
      let delta = minutesOf(r.time) - nowMin;
      if (delta < 0 || (delta === 0 && r.lastFired === todayKey(now))) delta += 1440;
      const [h, m] = r.time.split(":").map(Number);
      if (!best || delta < best.delta) best = { r, delta, at: fmtHM(h, m), tomorrow: delta + nowMin >= 1440 };
    }
    return best;
  }

  function renderNext(now) {
    const n = nextReminder(now);
    const box = $("next"), txt = $("nextText");
    if (!n) {
      box.classList.add("empty");
      txt.textContent = state.reminders.length ? "提醒皆已關閉" : "尚未設定提醒";
      return;
    }
    box.classList.remove("empty");
    const mins = Math.ceil(n.delta);
    const rel = mins < 60 ? `${mins} 分鐘後` : `${Math.floor(mins / 60)} 小時 ${mins % 60} 分後`;
    txt.textContent = "";
    const when = document.createElement("span"); when.className = "when";
    when.textContent = (n.tomorrow ? "明天 " : "") + n.at;
    const lbl = document.createElement("span"); lbl.className = "lbl";
    lbl.textContent = ` ${n.r.label ? n.r.label + " · " : ""}${rel}`;
    txt.append(when, lbl);
  }

  let ringing = null, autoStop = 0;

  function check(now) {
    if (ringing) return;
    const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const key = todayKey(now);
    for (const r of state.reminders) {
      if (!r.on) continue;
      if (r.snoozeUntil) {
        if (Date.now() >= r.snoozeUntil) { r.snoozeUntil = 0; save(); fire(r, now); return; }
        continue;
      }
      if (r.time === hm && r.lastFired !== key) {
        r.lastFired = key;
        if (r.repeat === "once") r.on = false;
        save();
        fire(r, now);
        return;
      }
    }
  }

  // ── Alarm takeover ──
  function fire(r, now) {
    ringing = r;
    $("aTime").innerHTML = fmtHM(now.getHours(), now.getMinutes()).replace(":", '<span class="a-colon">:</span>');
    $("aLabel").textContent = r.label || "提醒時間到了";
    document.body.classList.add("alarming");
    $("alarm").setAttribute("aria-hidden", "false");
    closeSettings();
    startTone();
    if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
    setTimeout(() => $("okBtn").focus(), 400);
    autoStop = setTimeout(dismiss, 3 * 60 * 1000);
    renderList();
  }
  function dismiss() {
    clearTimeout(autoStop);
    stopTone();
    ringing = null;
    document.body.classList.remove("alarming");
    $("alarm").setAttribute("aria-hidden", "true");
    tick();
  }
  $("okBtn").onclick = dismiss;
  $("snoozeBtn").onclick = () => {
    const r = state.reminders.find((x) => x.id === ringing?.id);
    if (r) { r.on = true; r.snoozeUntil = Date.now() + 5 * 60 * 1000; save(); }
    dismiss();
    renderList();
  };

  // ── Sound (Web Audio, unlocked on first tap) ──
  let ctx = null, toneTimer = 0;
  function ensureAudio() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
    } catch {}
    return ctx;
  }
  function chime() {
    const c = ensureAudio(); if (!c) return;
    const t0 = c.currentTime;
    [880, 1318.5, 1760].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      const t = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t + 0.65);
    });
  }
  function startTone() { chime(); clearInterval(toneTimer); toneTimer = setInterval(chime, 1400); }
  function stopTone() { clearInterval(toneTimer); }
  $("testBtn").onclick = () => chime();

  // ── Wake lock & unlock hint ──
  let wakeLock = null, unlocked = false;
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator && !wakeLock && document.visibilityState === "visible") {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch {}
  }
  const hideHint = () => $("hint").classList.add("gone");
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    const c = ensureAudio();
    try { const o = c.createOscillator(), g = c.createGain(); g.gain.value = 0.0001; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + 0.05); } catch {}
    keepAwake();
    hideHint();
  }
  document.addEventListener("pointerdown", unlock, { capture: true });
  document.addEventListener("keydown", unlock, { capture: true });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); tick(); } });
  setTimeout(() => { if (!unlocked) $("hint").classList.remove("gone"); }, 600);
  setTimeout(hideHint, 12000);

  // ── Fullscreen ──
  const fsEl = document.documentElement;
  const canFs = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
  if (!canFs) $("fsBtn").style.display = "none";
  $("fsBtn").onclick = () => {
    try {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (isFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const p = canFs.call(fsEl); if (p && p.catch) p.catch(() => {}); }
    } catch {}
  };

  // ── Pages & swipe ──
  // Three pages on one line: calculator (-1) · clock (0) · price notice (1).
  // pos is continuous; the finger drives it while dragging, and a critically damped
  // spring carries it home on release, keeping the release velocity.
  // The side pages pour in over the clock through a liquid edge (clip-path) that
  // bulges toward the finger and ripples while moving, led by a darker wave.
  // The notice comes from the right; the calculator is its mirror image from the left.
  const pager = $("pager"), clockEl = $("pClock"), noticeEl = $("pNotice"), calcEl = $("pCalc");
  const shade = $("shade"), wave = $("wave");
  const PAGES = { "-1": calcEl, "0": clockEl, "1": noticeEl };
  const DOTS = { "-1": $("dotC"), "0": $("dot0"), "1": $("dot1") };
  const reduceMQ = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let page = [-1, 0, 1].includes(state.page) ? state.page : 0;
  let pos = page, vel = 0, target = page, edge = 0, raf = 0, last = 0;
  let anchorY = window.innerHeight / 2, dir = 1, drag = null, suppressClick = false;

  // Smooth closed shape right of the curve x = f(y) (or, mirrored, left of w - f(y)), as an SVG path.
  function liquidPath(w, h, f, mirror) {
    const X = (x) => (mirror ? w - x : x).toFixed(1);
    const N = 18, pts = [];
    for (let i = 0; i <= N; i++) { const y = (i / N) * h; pts.push([f(y), y]); }
    let d = `M${X(w + 4)},-4 L${X(pts[0][0])},-4 L${X(pts[0][0])},0`;
    for (let i = 0; i < N; i++) {           // Catmull-Rom through the samples, as cubic Béziers
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${X(c1x)},${c1y.toFixed(1)} ${X(c2x)},${c2y.toFixed(1)} ${X(p2[0])},${p2[1].toFixed(1)}`;
    }
    return d + ` L${X(pts[N][0])},${h + 4} L${X(w + 4)},${h + 4} Z`;
  }

  // Edge curve for a side page at progress p (0 hidden … 1 covering the clock).
  function edgeFn(p, w, h, sgn, now, lead, amp, phase, extra) {
    const swell = Math.sin(Math.PI * p);                 // 0 at rest, 1 mid-way
    const bulge = Math.min(w * 0.2, 220) * swell * sgn;   // lobe leads in the direction of travel
    const R = h * 0.34, t = now / 1000;
    const edgeX = (1 - p) * (w + 40) - 20 * swell;
    return (y) => {
      const g = Math.exp(-(((y - anchorY) / R) ** 2));
      const ripple = amp * swell * Math.sin((y / h) * Math.PI * 3 + t * 5 + phase);
      return edgeX - lead * swell - bulge * g * (1 + extra) - ripple;
    };
  }

  function paintSide(el, p, mirror, w, h, now) {
    if (p >= 0.999) { el.style.clipPath = ""; el.style.visibility = "visible"; return false; }

  const calc = { tokens: [], cur: "0", done: false, error: "", lastExpr: "" };
  const OPS = ["+", "−", "×", "÷"];
  const MAX_DIGITS = 12;

  function fmtNum(str) {
    if (str === "" || str == null) return "";

    const neg = str.startsWith("-");
    const [i, f] = str.replace("-", "").split(".");

  function numStr(n) {

  }
  function evaluate(list) {                         // [n, op, n, op, n …]
    const nums = [parseFloat(list[0])], ops = [];
    for (let i = 1; i < list.length; i += 2) {

      if (op === "×" || op === "÷") {

        const a = nums.pop();
        nums.push(op === "×" ? a * n : a / n);
      } else { ops.push(op); nums.push(n); }

  function fitOut() {

    }
  }
  function renderCalc() {
    const out = $("cOut"), ex = $("cExpr");
    out.classList.toggle("err", !!calc.error);
    if (calc.error) { out.textContent = calc.error; ex.textContent = calc.lastExpr; }
    else {
      out.textContent = fmtNum(calc.cur || calc.tokens[calc.tokens.length - 2] || "0");
      let line = calc.done ? calc.lastExpr : (calc.tokens.length ? exprText([...calc.tokens, calc.cur]) : "");
      if (line.length > 34) line = "…" + line.slice(-33);

  function tick() {
    const now = new Date();
    render(now);
    check(now);
    renderNext(now);
  }
  function loop() {
    tick();
    setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
  }

  // ── Ambient floaters: warm-black dots and thick strokes drifting in the empty space ──
  // Each page gets its own set. A floater loops slowly around an anchor, and an anchor
  // is only accepted where its whole loop stays clear of that page's content (time,
  // prices, readout, controls), so nothing ever drifts behind text. Drawn at 30 fps into
  // the canvas behind each visible page; paused when hidden, still under reduced motion.
  const fx = {
    canvases: { "-1": calcEl.querySelector(".fx"), "0": clockEl.querySelector(".fx"), "1": noticeEl.querySelector(".fx") },
    sets: { "-1": [], "0": [], "1": [] }, w: 0, h: 0, dpr: 1, lastDraw: 0, timer: 0,
    color: getComputedStyle(document.documentElement).getPropertyValue("--floater").trim() || "#1A0B04",
  };
  // Box of el in its page's resting coordinates (offsets ignore the transition transforms).
  function restBox(el, pageEl) {
    let x = 0, y = 0, n = el;
    while (n && n !== pageEl) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    return { x, y, w: el.offsetWidth, h: el.offsetHeight };
  }
  function keepOut(k) {
    const pageEl = PAGES[k], boxes = [];
    const add = (el) => { if (el && el.offsetWidth) boxes.push(restBox(el, pageEl)); };
    if (k === "0") { add($("time")); add(clockEl.querySelector(".top")); add($("next")); }
    if (k === "1") { add($("nTitle")); add($("nClock")); noticeEl.querySelectorAll(".n-items li").forEach(add); add($("nNote")); }
    if (k === "-1") { add($("cKeys")); add($("cExpr")); add($("cOut")); }
    for (const el of [document.querySelector(".dots"), document.querySelector(".actions")]) {
      const r = el.getBoundingClientRect(); boxes.push({ x: r.left, y: r.top, w: r.width, h: r.height });
    }
    return boxes;
  }
  function seedFloaters() {
    const w = window.innerWidth, h = window.innerHeight;
    fx.w = w; fx.h = h; fx.dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const c of Object.values(fx.canvases)) { c.width = Math.round(w * fx.dpr); c.height = Math.round(h * fx.dpr); }
    const target = Math.round(clamp((w * h) / 52000, 12, 24));
    for (const k of ["-1", "0", "1"]) {
      let seed = 7 + (Number(k) + 1) * 101;             // stable layout per page and screen size (must stay positive)
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const boxes = keepOut(k), set = [];
      for (let tries = 0; set.length < target && tries < 900; tries++) {
        const line = rnd() < 0.34, s = rnd() ** 1.8;    // mostly small, a few large
        const f = {
          line, x: rnd() * w, y: rnd() * h,
          r: line ? 0 : 2 + s * 13, len: line ? 26 + s * 64 : 0, lw: line ? 5 + s * 5 : 0,
          a: 0.42 + s * 0.38,
          ax: 10 + rnd() * 26, ay: 8 + rnd() * 20,      // loop size
          fx: (Math.PI * 2) / (22 + rnd() * 20), fy: (Math.PI * 2) / (26 + rnd() * 22),
          px: rnd() * 6.3, py: rnd() * 6.3, rot: rnd() * Math.PI, spin: (rnd() - 0.5) * 0.24,
        };
        const reach = (f.line ? f.len / 2 + f.lw : f.r) + 14;   // shape size + breathing room
        const hit = boxes.some((b) =>
          f.x + f.ax + reach > b.x && f.x - f.ax - reach < b.x + b.w &&
          f.y + f.ay + reach > b.y && f.y - f.ay - reach < b.y + b.h);
        const off = f.x - f.ax - reach < 0 && f.x + f.ax + reach > w;   // never wider than the screen
        if (!hit && !off) set.push(f);
      }
      fx.sets[k] = set;
    }
  }
  function reseedSoon() { clearTimeout(fx.timer); fx.timer = setTimeout(() => { seedFloaters(); drawFloaters(performance.now()); }, 120); }
  function drawFloaters(now) {
    const t = reduceMQ.matches ? 0 : now / 1000;
    const show = { "-1": pos < -0.0005, "0": Math.abs(pos) < 0.999, "1": pos > 0.0005 };
    for (const k of ["-1", "0", "1"]) {
      const c = fx.canvases[k];
      if (!show[k]) { if (c.dataset.drawn) { c.getContext("2d").clearRect(0, 0, c.width, c.height); delete c.dataset.drawn; } continue; }
      const g = c.getContext("2d");
      g.setTransform(fx.dpr, 0, 0, fx.dpr, 0, 0);
      g.clearRect(0, 0, fx.w, fx.h);
      g.fillStyle = g.strokeStyle = fx.color;
      g.lineCap = "round";
      for (const f of fx.sets[k]) {
        const x = f.x + f.ax * Math.sin(t * f.fx + f.px), y = f.y + f.ay * Math.sin(t * f.fy + f.py);
        g.globalAlpha = f.a;
        if (f.line) {
          const ang = f.rot + t * f.spin, dx = Math.cos(ang) * f.len / 2, dy = Math.sin(ang) * f.len / 2;
          g.lineWidth = f.lw;
          g.beginPath(); g.moveTo(x - dx, y - dy); g.lineTo(x + dx, y + dy); g.stroke();
        } else {
          g.beginPath(); g.arc(x, y, f.r, 0, Math.PI * 2); g.fill();
        }
      }
      c.dataset.drawn = "1";
    }
  }
  function fxLoop(now) {
    if (now - fx.lastDraw >= 33) { fx.lastDraw = now; drawFloaters(now); }   // ~30 fps
    if (!reduceMQ.matches && document.visibilityState === "visible") requestAnimationFrame(fxLoop);
  }
  seedFloaters();
  window.addEventListener("resize", reseedSoon);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reseedSoon);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") requestAnimationFrame(fxLoop); });
  if (reduceMQ.addEventListener) reduceMQ.addEventListener("change", () => requestAnimationFrame(fxLoop));

  target = page; paint(); settle();
  drawFloaters(performance.now());
  requestAnimationFrame(fxLoop);
  renderCalc();
  renderList();
  renderItems();
  renderNotice();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNotice);
  loop();

  // ── Offline: service worker precaches the page, fonts and icons ──
  const offlineEl = $("offline");
  function setOffline(text, ready) { offlineEl.textContent = text; offlineEl.classList.toggle("ready", !!ready); }
  async function checkOffline() {
    try {
      const hit = await caches.match("fonts/chiron-goround-tc.woff2");
      setOffline(hit ? "已可離線使用" : "下載中，請保持連線", !!hit);
      if (!hit) setTimeout(checkOffline, 3000);
    } catch { setOffline("無法檢查", false); }
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(checkOffline)
      .catch(() => setOffline("此網址不支援離線", false));
  } else {
    setOffline("需從網址開啟才能離線", false);
  }
})();
</script>
</body>
</html>
