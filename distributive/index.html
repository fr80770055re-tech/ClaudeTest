<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分配律與交換律圖解｜五年級數學</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:     #2563EB;
      --blue-lt:  #DBEAFE;
      --amber:    #F59E0B;
      --amber-lt: #FEF3C7;
      --amber-dk: #B45309;
      --green-lt: #F0FDF4;
      --red:      #DC2626;
      --red-lt:   #FEF2F2;
      --ink:      #1E293B;
      --muted:    #64748B;
      --border:   #E2E8F0;
      --white:    #FFFFFF;
      --radius:   12px;
      --shadow:   0 4px 20px rgba(37,99,235,.10);
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--green-lt);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: var(--blue);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 3px 12px rgba(37,99,235,.35);
    }
    header .logo {
      width: 44px; height: 44px;
      background: #fff;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    header .logo svg { width: 30px; height: 30px; }
    header h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: .04em; }
    header p  { font-size: .8rem; opacity: .8; margin-top: 2px; }
    header a {
      margin-left: auto;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: .8rem;
      white-space: nowrap;
    }

    .app { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }

    /* ─── Mode tabs ─── */
    .tabs {
      display: flex; gap: 6px;
      background: var(--white);
      border-radius: var(--radius);
      padding: 6px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1; padding: 10px 4px;
      border: none; background: transparent; border-radius: 8px;
      font-family: inherit; font-size: .95rem; font-weight: 700;
      color: var(--muted); cursor: pointer;
    }
    .tab-btn.active { background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.30); }

    /* ─── Toolbar ─── */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center;
      background: var(--white);
      border-radius: var(--radius);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .nums { display: flex; align-items: center; gap: 8px; font-size: 1.5rem; font-weight: 900; }
    .nums input {
      width: 4.6em; padding: 6px 8px;
      font: inherit; text-align: center; color: var(--ink);
      border: 2px solid var(--border); border-radius: 8px; outline: none;
    }
    .nums input::placeholder { font-size: .9rem; font-weight: 500; color: #CBD5E1; }
    .nums input:focus { border-color: var(--blue); }
    .k-part { display: contents; }
    .k-part[hidden] { display: none; }
    .chip {
      padding: 7px 12px;
      border: 2px solid var(--border); border-radius: 99px;
      background: var(--white); color: var(--ink);
      font-family: inherit; font-size: .88rem; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    .chip:hover { border-color: var(--blue); color: var(--blue); }
    .chip[hidden] { display: none; }
    .chip.solid { background: var(--blue); border-color: var(--blue); color: #fff; }
    .chip.solid:hover { opacity: .9; color: #fff; }
    .dots-toggle { display: flex; align-items: center; gap: 6px; font-size: .88rem; font-weight: 700; cursor: pointer; }
    .dots-toggle input { width: 18px; height: 18px; accent-color: var(--blue); }
    .dots-toggle.off { opacity: .4; cursor: default; }

    /* ─── Examples ─── */
    .examples { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; width: 100%; padding-top: 10px; border-top: 1px dashed var(--border); }
    .examples .lbl { font-size: .8rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .ex-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ex-row .empty { font-size: .85rem; color: var(--muted); }
    .mine { display: inline-flex; align-items: stretch; }
    .mine .chip { border-radius: 99px 0 0 99px; border-right: none; }
    .mine .del {
      border: 2px solid var(--border); border-left: 1px solid var(--border);
      border-radius: 0 99px 99px 0; background: var(--white);
      color: var(--muted); font-size: .9rem; padding: 0 10px; cursor: pointer;
    }
    .mine .del:hover { color: var(--red); border-color: var(--red); }

    /* ─── Figure ─── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 16px;
    }
    #fig { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; font-family: 'Noto Sans TC', sans-serif; outline: none; }
    #fig:focus-visible { outline: 3px solid var(--blue-lt); border-radius: 8px; }
    .fade { transition: opacity .5s ease; }
    .hint { font-size: .9rem; color: var(--muted); text-align: center; margin-top: 2px; min-height: 1.4em; }

    /* ─── Equations ─── */
    .eq { margin-top: 14px; padding: 18px 24px; }
    .eq-line {
      font-size: clamp(1.35rem, 3.2vw, 2.2rem);
      font-weight: 900; line-height: 1.45;
      opacity: .4; transition: opacity .2s;
    }
    .eq-line.now { opacity: 1; }
    .eq-say {
      font-size: clamp(1rem, 1.9vw, 1.25rem);
      font-weight: 500; color: var(--muted);
      margin: 0 0 8px 1.4em;
    }
    .eq-q { font-size: clamp(1.1rem, 2.2vw, 1.5rem); font-weight: 900; margin-top: 8px; }
    .b { color: var(--blue); }
    .a { color: var(--amber-dk); }
    .r { color: var(--red); }
    .ok { color: #15803D; }

    .stepper { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px;
      border: 2px solid var(--blue); border-radius: var(--radius);
      background: var(--white); color: var(--blue);
      font-family: inherit; font-size: 1.05rem; font-weight: 900;
      cursor: pointer;
    }
    .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.30); }
    .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
    .btn:disabled { opacity: .35; cursor: default; box-shadow: none; }

    @media (max-width: 600px) {
      header h1 { font-size: 1rem; }
      .nums { font-size: 1.2rem; }
      .eq { padding: 14px 14px; }
      .examples { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="7" width="19" height="16" rx="1.5" fill="#2563EB"/>
      <rect x="23" y="7" width="5" height="16" rx="1.5" fill="#F59E0B"/>
    </svg>
  </div>
  <div>
    <h1>分配律與交換律圖解</h1>
    <p>台灣國小五年級數學 · 用長方形看懂乘法的規律</p>
  </div>
  <a href="../">周長與面積出題工具 →</a>
</header>

<div class="app">
  <div class="tabs" role="tablist">
    <button class="tab-btn active" role="tab" data-mode="learn">🧩 分配律</button>
    <button class="tab-btn" role="tab" data-mode="wrong">🔍 找找看錯在哪</button>
    <button class="tab-btn" role="tab" data-mode="commute">🔄 交換律</button>
  </div>

  <div class="toolbar">
    <div class="nums">
      <input id="in-a" type="number" min="2" max="999" inputmode="numeric" aria-label="第一個數" />
      <span>×</span>
      <input id="in-b" type="number" min="2" max="999" inputmode="numeric" aria-label="第二個數" />
      <span class="k-part" id="k-part" hidden>
        <span>×</span>
        <input id="in-k" type="number" min="2" max="999" inputmode="numeric" placeholder="可空白" aria-label="第三個數（可空白）" />
      </span>
    </div>
    <button class="chip" id="btn-swap" title="兩個數交換位置">⇄ 交換</button>
    <button class="chip" id="btn-nice">✂️ 拆成好算的數</button>
    <label class="dots-toggle" id="dots-wrap"><input type="checkbox" id="chk-dots" /> 顯示點點</label>

    <div class="examples">
      <span class="lbl">例題</span>
      <div class="ex-row" id="ex-builtin"></div>
      <span class="lbl">我的例題</span>
      <div class="ex-row">
        <span id="ex-mine" class="ex-row"></span>
        <button class="chip solid" id="btn-save">＋ 存目前題目</button>
        <button class="chip" id="btn-rand">🎲 隨機一題</button>
      </div>
    </div>
  </div>

  <div class="card">
    <svg id="fig" viewBox="0 0 1000 440" tabindex="0" aria-label="乘法長方形圖"><g id="g"></g></svg>
    <p class="hint" id="hint"></p>
  </div>

  <div class="card eq">
    <div id="eq"></div>
    <div class="stepper" id="stepper"></div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
// 分配律與找錯共用一組數字；交換律另一組（可有第三個數 k）
const state = {
  mode: 'learn',
  dist: { a: 205, b: 15, c: 200 },
  com:  { a: 12, b: 3, k: 0 },
  step: 0,
  checked: false,
  dots: false,
};
const $ = id => document.getElementById(id);
const isCom = () => state.mode === 'commute';

const COLOR = {
  blue: '#2563EB', blueLt: '#DBEAFE', blueMid: '#BFDBFE',
  amber: '#F59E0B', amberLt: '#FEF3C7', amberMid: '#FDE68A', amberDk: '#B45309',
  red: '#DC2626', redLt: '#FEF2F2',
  gray: '#E2E8F0', grayDk: '#64748B', dot: '#94A3B8', ink: '#1E293B',
};

// ─── Example bank ─────────────────────────────────────────────────────────────
const BUILTIN = {
  dist: [
    [12, 3], [14, 6], [23, 4], [36, 5], [48, 7], [57, 8],
    [102, 25], [104, 15], [205, 15], [306, 12], [408, 25], [503, 16],
  ],
  com: [
    [3, 5], [4, 7], [6, 9], [12, 3], [8, 15],
    [25, 37, 4], [5, 19, 2], [125, 7, 8], [4, 23, 25], [50, 13, 2],
  ],
};
const STORE_KEY = 'distributive-my-examples-v1';
function loadMine() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return { dist: Array.isArray(v.dist) ? v.dist : [], com: Array.isArray(v.com) ? v.com : [] };
  } catch { return { dist: [], com: [] }; }
}
function saveMine(m) { try { localStorage.setItem(STORE_KEY, JSON.stringify(m)); } catch {} }
let mine = loadMine();

const group = () => isCom() ? 'com' : 'dist';
const exLabel = ex => ex.filter(Boolean).join(' × ');

function renderExamples() {
  const g = group();
  $('ex-builtin').innerHTML = BUILTIN[g].map((ex, i) =>
    `<button class="chip" data-i="${i}">${exLabel(ex)}</button>`).join('');
  $('ex-builtin').querySelectorAll('.chip').forEach(btn =>
    btn.onclick = () => applyExample(BUILTIN[g][+btn.dataset.i]));

  const list = mine[g];
  $('ex-mine').innerHTML = list.length
    ? list.map((ex, i) => `<span class="mine"><button class="chip" data-i="${i}">${exLabel(ex)}</button><button class="del" data-i="${i}" aria-label="刪除">×</button></span>`).join('')
    : '<span class="empty">還沒有。輸入數字後按「存目前題目」。</span>';
  $('ex-mine').querySelectorAll('.chip').forEach(btn =>
    btn.onclick = () => applyExample(mine[g][+btn.dataset.i]));
  $('ex-mine').querySelectorAll('.del').forEach(btn => btn.onclick = () => {
    mine[g].splice(+btn.dataset.i, 1); saveMine(mine); renderExamples();
  });
}

function currentExample() {
  return isCom()
    ? [state.com.a, state.com.b, state.com.k].filter(Boolean)
    : [state.dist.a, state.dist.b];
}
$('btn-save').onclick = () => {
  const ex = currentExample();
  const g = group();
  if (!mine[g].some(m => exLabel(m) === exLabel(ex))) {
    mine[g].push(ex); saveMine(mine);
  }
  renderExamples();
};

const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
$('btn-rand').onclick = () => {
  if (isCom()) {
    if (Math.random() < .5) applyExample([rnd(2, 12), rnd(2, 12)]);
    else {
      const [x, y] = pick([[25, 4], [5, 2], [125, 8], [50, 2], [20, 5], [4, 25], [2, 50]]);
      applyExample([x, rnd(11, 99), y]);
    }
  } else if (Math.random() < .5) {
    let a; do { a = rnd(11, 99); } while (a % 10 === 0);
    applyExample([a, rnd(3, 9)]);
  } else {
    applyExample([rnd(1, 9) * 100 + rnd(1, 9), rnd(11, 29)]);
  }
};

// 拆成好算的數：205 → 200 + 5、48 → 40 + 8、200 → 100 + 100
function niceSplit(a) {
  for (let k = Math.floor(Math.log10(a)); k >= 1; k--) {
    const p = 10 ** k;
    const c = a - (a % p);
    if (c > 0 && c < a) return c;
  }
  return Math.max(1, Math.floor(a / 2));
}

// ─── SVG helpers ──────────────────────────────────────────────────────────────
const rectEl = (x, y, w, h, fill, stroke, extra = '') =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" stroke-width="3" ${extra}/>`;
const textEl = (x, y, t, { size = 30, fill = COLOR.ink, anchor = 'middle', weight = 900 } = {}) =>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" dominant-baseline="middle">${t}</text>`;
function brace(x1, x2, y, color) {
  return `<path d="M${x1} ${y + 10} V${y} H${x2} V${y + 10}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
}
function vbrace(y1, y2, x, color) {
  return `<path d="M${x + 10} ${y1} H${x} V${y2} H${x + 10}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
}

// ═══ 分配律 ═══════════════════════════════════════════════════════════════════
const X0 = 90, Y0 = 84, MAXW = 860, MAXH = 290, MIN_PIECE = 46;

function distLayout() {
  const { a, b } = state.dist;
  const dotsOK = a <= 30 && b <= 20;
  const dots = state.dots && dotsOK;
  let W, H, cell = 0;
  if (dots) {
    cell = Math.min(MAXW / a, MAXH / b);
    W = cell * a; H = cell * b;
  } else {
    W = MAXW;
    H = Math.max(110, Math.min(MAXH, MAXW * b / a));
  }
  const ratioTrue = dots || (Math.abs(H - MAXW * b / a) < 1 && MAXW / a >= MIN_PIECE);
  const ox = X0 + (MAXW - W) / 2;
  return { W, H, cell, dots, dotsOK, ratioTrue, ox, oy: Y0 };
}

// 數字大時讓窄的那塊至少有 MIN_PIECE 寬，才看得到、拖得到
function margin(L) { return Math.min(L.W / 2, Math.max(L.W / state.dist.a, MIN_PIECE)); }
function cutX(c, L) {
  const a = state.dist.a;
  if (L.dots) return c * L.cell;
  if (a <= 2) return L.W / 2;
  const m = margin(L);
  return m + (c - 1) / (a - 2) * (L.W - 2 * m);
}
function cFromX(x, L) {
  const a = state.dist.a;
  let c;
  if (L.dots) c = Math.round(x / L.cell);
  else if (a <= 2) c = 1;
  else { const m = margin(L); c = Math.round((x - m) / (L.W - 2 * m) * (a - 2) + 1); }
  return Math.min(a - 1, Math.max(1, c));
}

function renderDistFigure() {
  comKey = '';
  const L = distLayout();
  const { a, b, c } = state.dist;
  const { step, mode, checked } = state;
  const d = a - c;
  const learn = mode === 'learn';
  const showCut = !learn || step >= 1;
  const missing = !learn && checked;
  const showInside = learn ? step >= 2 : checked;
  const showAreas = learn ? step >= 3 : checked;
  const { ox, oy, W, H } = L;
  const xc = cutX(c, L);
  $('fig').setAttribute('viewBox', `0 0 1000 ${oy + H + (showAreas ? 96 : 60)}`);

  let s = '';
  if (!showCut) {
    s += rectEl(ox, oy, W, H, COLOR.gray, COLOR.grayDk);
  } else {
    s += rectEl(ox, oy, xc, H, COLOR.blueLt, COLOR.blue);
    if (missing) s += rectEl(ox + xc, oy, W - xc, H, COLOR.redLt, COLOR.red, 'stroke-dasharray="10 8"');
    else s += rectEl(ox + xc, oy, W - xc, H, COLOR.amberLt, COLOR.amber);
  }

  if (L.dots) {
    const r = L.cell * 0.26;
    for (let i = 0; i < a; i++) {
      for (let j = 0; j < b; j++) {
        const cx = ox + (i + 0.5) * L.cell, cy = oy + (j + 0.5) * L.cell;
        if (!showCut) s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${COLOR.dot}"/>`;
        else if (i < c) s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${COLOR.blue}"/>`;
        else if (missing) s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${COLOR.red}" stroke-width="2" stroke-dasharray="4 3"/>`;
        else s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${COLOR.amber}"/>`;
      }
    }
  }

  if (!showCut) {
    s += brace(ox, ox + W, oy - 22, COLOR.grayDk);
    s += textEl(ox + W / 2, oy - 50, a, { size: 34 });
  } else {
    s += brace(ox + 2, ox + xc - 4, oy - 22, COLOR.blue);
    s += brace(ox + xc + 4, ox + W - 2, oy - 22, missing ? COLOR.red : COLOR.amber);
    s += textEl(ox + xc / 2, oy - 50, c, { size: 34, fill: COLOR.blue });
    s += textEl(ox + xc + (W - xc) / 2, oy - 50, d, { size: 34, fill: missing ? COLOR.red : COLOR.amberDk });
  }
  s += textEl(ox - 20, oy + H / 2, b, { size: 34, anchor: 'end' });

  if (showInside && !L.dots) {
    if (xc >= 170) s += textEl(ox + xc / 2, oy + H / 2, `${c} 個 ${b}`, { size: 30, fill: COLOR.blue });
    const rw = W - xc;
    if (rw >= 170) s += textEl(ox + xc + rw / 2, oy + H / 2, missing ? '不見了！' : `${d} 個 ${b}`, { size: 30, fill: missing ? COLOR.red : COLOR.amberDk });
  }

  if (showCut) {
    const x = ox + xc;
    s += `<line x1="${x}" y1="${oy - 12}" x2="${x}" y2="${oy + H + 12}" stroke="${COLOR.ink}" stroke-width="3" stroke-dasharray="8 6"/>`;
    s += `<g style="cursor:ew-resize">
            <circle cx="${x}" cy="${oy + H + 26}" r="17" fill="${COLOR.ink}"/>
            <path d="M${x - 9} ${oy + H + 26} l6 -6 v12 z M${x + 9} ${oy + H + 26} l-6 -6 v12 z" fill="#fff"/>
          </g>`;
  }

  if (showAreas) {
    const y = oy + H + 72;
    const leftTxt = `${c} × ${b} = ${c * b}`;
    const rightTxt = missing ? `${d} × ${b} = ${d * b}，不見了！` : `${d} × ${b} = ${d * b}`;
    const rw = W - xc;
    const la = xc < 260 ? ['start', ox] : ['middle', ox + xc / 2];
    const ra = rw < 260 ? ['end', ox + W] : ['middle', ox + xc + rw / 2];
    s += textEl(la[1], y, leftTxt, { size: 28, fill: COLOR.blue, anchor: la[0] });
    s += textEl(ra[1], y, rightTxt, { size: 28, fill: missing ? COLOR.red : COLOR.amberDk, anchor: ra[0] });
  }

  $('g').innerHTML = s;

  const tips = [];
  if (showCut) tips.push('拖曳虛線（或按 ← →）可以換一種拆法');
  if (!L.ratioTrue) tips.push('示意圖：沒有照實際比例畫');
  $('hint').textContent = tips.join('　·　');
  setDotsToggle(L.dotsOK, L.dots);
}

// ═══ 交換律 ═══════════════════════════════════════════════════════════════════
// 圖上畫「被交換的那兩個數」p × q：寬 p 條、每條 q 個。轉 90° 後變成寬 q 條、每條 p 個。
const S = 320, CX = 500, MIN_SIDE = 56;
let comKey = '';

function comPair() {
  const { a, b, k } = state.com;
  return k ? [b, k] : [a, b];
}
function comLayout() {
  const [p, q] = comPair();
  const mx = Math.max(p, q);
  const dotsOK = mx <= 15;
  const dots = state.dots && dotsOK;
  let w = S * p / mx, h = S * q / mx;
  const ratioTrue = w >= MIN_SIDE && h >= MIN_SIDE;
  w = Math.max(w, MIN_SIDE); h = Math.max(h, MIN_SIDE);
  return { p, q, w, h, dots, dotsOK, ratioTrue, cy: 80 + S / 2 };
}

function buildComFigure(L) {
  const { p, q, w, h, cy } = L;
  const x0 = CX - w / 2, y0 = cy - h / 2;
  $('fig').setAttribute('viewBox', `0 0 1000 ${S + 160}`);

  // 會旋轉的部分：長方形、兩組條紋、點點
  let r = `<g id="rot" style="transform-origin:${CX}px ${cy}px; transition: transform .9s ease;">`;
  r += rectEl(x0, y0, w, h, COLOR.gray, COLOR.grayDk);
  // 藍色直條：p 條，每條 q 個（「p 個 q」）
  if (p <= 60) {
    r += `<g id="stripe-p" class="fade">`;
    for (let i = 0; i < p; i++) {
      r += `<rect x="${x0 + i * w / p}" y="${y0}" width="${w / p}" height="${h}" fill="${i % 2 ? COLOR.blueMid : COLOR.blueLt}"/>`;
    }
    r += `</g>`;
  }
  // 橘色橫條：q 條，轉 90° 後變成直條（「q 個 p」）
  if (q <= 60) {
    r += `<g id="stripe-q" class="fade" opacity="0">`;
    for (let j = 0; j < q; j++) {
      r += `<rect x="${x0}" y="${y0 + j * h / q}" width="${w}" height="${h / q}" fill="${j % 2 ? COLOR.amberMid : COLOR.amberLt}"/>`;
    }
    r += `</g>`;
  }
  r += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="${COLOR.ink}" stroke-width="3"/>`;
  if (L.dots) {
    const cw = w / p, ch = h / q, rad = Math.min(cw, ch) * 0.24;
    for (let i = 0; i < p; i++) for (let j = 0; j < q; j++) {
      r += `<circle cx="${x0 + (i + .5) * cw}" cy="${y0 + (j + .5) * ch}" r="${rad}" fill="${COLOR.ink}"/>`;
    }
  }
  r += `</g>`;

  // 不旋轉的標籤：原本方向、轉過來之後各一組
  let o = `<g id="lab-orig" class="fade">`;
  o += brace(CX - w / 2, CX + w / 2, cy - h / 2 - 22, COLOR.blue);
  o += textEl(CX, cy - h / 2 - 50, `${p} 條`, { size: 32, fill: COLOR.blue });
  o += vbrace(cy - h / 2, cy + h / 2, CX - w / 2 - 22, COLOR.grayDk);
  o += textEl(CX - w / 2 - 32, cy, `每條 ${q} 個`, { size: 28, anchor: 'end' });
  o += textEl(CX, cy + h / 2 + 46, `${p} × ${q}`, { size: 34 });
  o += `</g>`;

  let t = `<g id="lab-rot" class="fade" opacity="0">`;
  t += brace(CX - h / 2, CX + h / 2, cy - w / 2 - 22, COLOR.amberDk);
  t += textEl(CX, cy - w / 2 - 50, `${q} 條`, { size: 32, fill: COLOR.amberDk });
  t += vbrace(cy - w / 2, cy + w / 2, CX - h / 2 - 22, COLOR.grayDk);
  t += textEl(CX - h / 2 - 32, cy, `每條 ${p} 個`, { size: 28, anchor: 'end' });
  t += textEl(CX, cy + w / 2 + 46, `${q} × ${p}`, { size: 34 });
  t += `</g>`;

  $('g').innerHTML = r + o + t;
}

function renderComFigure() {
  const L = comLayout();
  const key = `${L.p},${L.q},${L.dots}`;
  if (key !== comKey) { buildComFigure(L); comKey = key; }
  const rotated = state.step >= 1;
  // 先讓瀏覽器畫出原狀態，再加上旋轉，動畫才會出現
  requestAnimationFrame(() => {
    const rot = $('rot');
    if (!rot) return;
    rot.style.transform = rotated ? 'rotate(90deg)' : 'rotate(0deg)';
    const setO = (id, v) => { const el = $(id); if (el) el.setAttribute('opacity', v); };
    setO('stripe-p', rotated ? 0 : 1);
    setO('stripe-q', rotated ? 1 : 0);
    setO('lab-orig', rotated ? 0 : 1);
    setO('lab-rot', rotated ? 1 : 0);
  });

  const tips = [rotated ? '按「上一步」可以轉回去' : '按「下一步」把長方形轉 90°'];
  if (!L.ratioTrue) tips.push('示意圖：沒有照實際比例畫');
  $('hint').textContent = tips.join('　·　');
  setDotsToggle(L.dotsOK, L.dots);
}

// ─── Dots toggle ──────────────────────────────────────────────────────────────
function setDotsToggle(ok, on) {
  $('dots-wrap').classList.toggle('off', !ok);
  $('chk-dots').disabled = !ok;
  $('chk-dots').checked = on;
}

// ─── Equations ────────────────────────────────────────────────────────────────
const B = t => `<span class="b">${t}</span>`;
const A = t => `<span class="a">${t}</span>`;
const R = t => `<span class="r">${t}</span>`;

function stepLines(lines) {
  const { step } = state;
  $('eq').innerHTML = lines.slice(0, step + 1).map(([main, say], i) =>
    `<div class="eq-line${i === step ? ' now' : ''}">${main}</div><div class="eq-say">${say}</div>`
  ).join('');
  const max = lines.length - 1;
  $('stepper').innerHTML = `
    <button class="btn" id="btn-prev" ${step === 0 ? 'disabled' : ''}>← 上一步</button>
    <button class="btn primary" id="btn-next" ${step >= max ? 'disabled' : ''}>下一步 →</button>
    <button class="btn" id="btn-reset">↺ 重來</button>`;
  $('btn-prev').onclick = () => { state.step--; render(); };
  $('btn-next').onclick = () => { state.step = Math.min(max, state.step + 1); render(); };
  $('btn-reset').onclick = () => { state.step = 0; render(); };
}

function renderLearn() {
  const { a, b, c } = state.dist;
  const d = a - c;
  stepLines([
    [`${a} × ${b}`, `${a} × ${b} 就是「${a} 個 ${b}」`],
    [`= (${B(c)} + ${A(d)}) × ${b}`, `把 ${a} 拆成 ${B(c)} 和 ${A(d)}`],
    [`= ${B(`${c} × ${b}`)} + ${A(`${d} × ${b}`)}`, `${B(`${c} 個 ${b}`)}，再加上 ${A(`${d} 個 ${b}`)}：兩塊都要乘 ${b}`],
    [`= ${B(c * b)} + ${A(d * b)}`, '分別算出兩塊有多大'],
    [`= ${a * b}`, `<span class="ok">直接算 ${a} × ${b} 也是 ${a * b}，拆開來算，答案不會變 ✓</span>`],
  ]);
}

function renderWrong() {
  const { a, b, c } = state.dist;
  const { checked } = state;
  const d = a - c;
  let html = `
    <div class="eq-say" style="margin-left:0">小明這樣算：</div>
    <div class="eq-line now">${a} × ${b} = ${B(`${c} × ${b}`)} + ${A(d)} = ${c * b + d}</div>
    <div class="eq-q">這樣算對嗎？用上面的圖檢查看看。</div>`;
  if (checked) {
    html = `
      <div class="eq-say" style="margin-left:0">小明這樣算：</div>
      <div class="eq-line">${a} × ${b} = ${B(`${c} × ${b}`)} + ${R(d)} = ${c * b + d}</div>
      <div class="eq-say">${R(`右邊那一塊是「${d} 個 ${b}」，等於 ${d * b}，小明只加了 ${d}`)}</div>
      <div class="eq-say" style="margin-left:0">正確的算法：</div>
      <div class="eq-line now">${a} × ${b} = ${B(`${c} × ${b}`)} + ${A(`${d} × ${b}`)} = ${B(c * b)} + ${A(d * b)} = ${a * b}</div>
      <div class="eq-say"><span class="ok">拆開的兩塊，都要乘 ${b}</span></div>`;
  }
  $('eq').innerHTML = html;
  $('stepper').innerHTML = checked
    ? `<button class="btn" id="btn-again">↺ 再看一次</button>`
    : `<button class="btn danger" id="btn-check">🔍 用圖檢查</button>`;
  if (checked) $('btn-again').onclick = () => { state.checked = false; render(); };
  else $('btn-check').onclick = () => { state.checked = true; render(); };
}

function renderCommute() {
  const { a, b, k } = state.com;
  if (!k) {
    stepLines([
      [`${B(`${a} × ${b}`)}`, `看成「${a} 個 ${b}」：藍色有 ${a} 條，每條 ${b} 個`],
      [`${A(`${b} × ${a}`)}`, `把長方形轉過來，變成「${b} 個 ${a}」：橘色有 ${b} 條，每條 ${a} 個`],
      [`${B(`${a} × ${b}`)} = ${A(`${b} × ${a}`)} = ${a * b}`, `<span class="ok">只是轉了方向，大小沒有變：兩個數交換位置，積不變 ✓</span>`],
    ]);
  } else {
    stepLines([
      [`${a} × ${B(b)} × ${A(k)}`, `${a} × ${b} 不好算，先看後面的 ${B(b)} × ${A(k)}`],
      [`${B(b)} × ${A(k)} = ${A(k)} × ${B(b)}`, `轉過來看，大小不變，所以 ${b} 和 ${k} 可以交換位置`],
      [`${a} × ${B(b)} × ${A(k)} = ${a} × ${A(k)} × ${B(b)}`, `把 ${A(k)} 換到前面，和 ${a} 放在一起`],
      [`= ${a * k} × ${B(b)} = ${a * b * k}`, `<span class="ok">先算 ${a} × ${k} = ${a * k}，再乘 ${b}，變好算了 ✓</span>`],
    ]);
  }
}

function render() {
  const com = isCom();
  $('k-part').hidden = !com;
  $('btn-nice').hidden = com;
  if (com) { renderComFigure(); renderCommute(); }
  else {
    renderDistFigure();
    if (state.mode === 'learn') renderLearn(); else renderWrong();
  }
}

// ─── Inputs ───────────────────────────────────────────────────────────────────
function clampNum(v, fallback) {
  const n = parseInt(v, 10);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(999, Math.max(2, n));
}

function syncInputs() {
  const n = isCom() ? state.com : state.dist;
  $('in-a').value = n.a; $('in-b').value = n.b;
  $('in-k').value = isCom() && state.com.k ? state.com.k : '';
}

function autoDots() {
  if (isCom()) { const [p, q] = comPair(); state.dots = Math.max(p, q) <= 15; }
  else state.dots = state.dist.a <= 30 && state.dist.b <= 20;
}

function applyExample(ex) {
  if (isCom()) {
    state.com = { a: ex[0], b: ex[1], k: ex[2] || 0 };
  } else {
    state.dist = { a: ex[0], b: ex[1], c: niceSplit(ex[0]) };
  }
  state.step = 0;
  state.checked = false;
  autoDots();
  syncInputs();
  render();
}

function readInputs() {
  const a = clampNum($('in-a').value, isCom() ? state.com.a : state.dist.a);
  const b = clampNum($('in-b').value, isCom() ? state.com.b : state.dist.b);
  const kRaw = $('in-k').value.trim();
  const k = kRaw === '' ? 0 : clampNum(kRaw, 0);
  applyExample(isCom() ? [a, b, k] : [a, b]);
}
['in-a', 'in-b', 'in-k'].forEach(id => {
  $(id).addEventListener('change', readInputs);
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
});

$('btn-swap').onclick = () => {
  if (isCom()) {
    const { a, b, k } = state.com;
    applyExample(k ? [a, k, b] : [b, a]);
  } else applyExample([state.dist.b, state.dist.a]);
};
$('btn-nice').onclick = () => { state.dist.c = niceSplit(state.dist.a); render(); };
$('chk-dots').onchange = e => { state.dots = e.target.checked; comKey = ''; render(); };

document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  const wasCom = isCom();
  state.mode = btn.dataset.mode;
  state.checked = false;
  if (wasCom !== isCom()) { state.step = 0; autoDots(); comKey = ''; }
  else if (state.mode === 'learn') state.step = Math.min(state.step, 4);
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  syncInputs();
  renderExamples();
  render();
});

// ─── Drag the cut line (分配律) ───────────────────────────────────────────────
const fig = $('fig');
let dragging = false;

function cutEnabled() { return state.mode === 'wrong' || (state.mode === 'learn' && state.step >= 1); }

function moveTo(evt) {
  const pt = fig.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(fig.getScreenCTM().inverse());
  const L = distLayout();
  const c = cFromX(p.x - L.ox, L);
  if (c !== state.dist.c) { state.dist.c = c; render(); }
}

fig.addEventListener('pointerdown', e => {
  if (!cutEnabled()) return;
  dragging = true;
  fig.setPointerCapture(e.pointerId);
  moveTo(e);
});
fig.addEventListener('pointermove', e => { if (dragging) moveTo(e); });
fig.addEventListener('pointerup', () => { dragging = false; });
fig.addEventListener('pointercancel', () => { dragging = false; });

fig.addEventListener('keydown', e => {
  if (!cutEnabled()) return;
  const delta = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (!delta) return;
  e.preventDefault();
  const n = e.shiftKey ? 10 : 1;
  state.dist.c = Math.min(state.dist.a - 1, Math.max(1, state.dist.c + delta * n));
  render();
});

// ─── Start ────────────────────────────────────────────────────────────────────
autoDots();
syncInputs();
renderExamples();
render();
</script>
</body>
</html>
